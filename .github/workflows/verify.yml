name: Verify

on:
  push:
    branches: [main]
  # Run on EVERY pull request regardless of base branch. A `branches: [main]`
  # filter here (removed 2026-06-08) matched on the PR's *base*, so a stacked
  # PR whose base was a feature branch silently skipped this entire suite and
  # merged on lightweight gates only. Running on all PRs makes stacked and
  # shallow PRs equally safe; re-adding a base filter reopens that hole.
  pull_request:

jobs:
  verify:
    name: Typecheck, Lint, Format, Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so npm ci can fetch @venturecrane/crane-test-harness from
      # GitHub Packages via the workflow's GITHUB_TOKEN.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Workers
        run: npm run typecheck:workers

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # 2026-06-12 code review: this step was missing — 7 worker test suites
      # ran locally via `npm run verify` but never in CI. Runs before the
      # per-worker `npm ci` steps below; the vitest binary resolves from the
      # root node_modules through npm's ancestor .bin PATH walk (the same
      # mechanism the Typecheck Workers step relies on).
      - name: Test Workers
        run: npm run test:workers

      # The root build writes `.wrangler/deploy/config.json` pointing at the
      # adapter-generated `dist/server/wrangler.json`. Leaving it in the tree
      # makes sub-worker `wrangler deploy` invocations ambiguous because
      # wrangler discovers both the sub-worker's own `wrangler.toml` and the
      # root's deploy config. Remove it before the sub-worker steps.
      - name: Clean root wrangler state
        run: rm -rf .wrangler

      - name: Build Job Monitor Worker
        run: cd workers/job-monitor && npm ci && npx wrangler deploy --dry-run --outdir=dist

      - name: Build New Business Worker
        run: cd workers/new-business && npm ci && npx wrangler deploy --dry-run --outdir=dist

      - name: Build Review Mining Worker
        run: cd workers/review-mining && npm ci && npx wrangler deploy --dry-run --outdir=dist

      - name: Build Social Listening Worker
        run: cd workers/social-listening && npm ci && npx wrangler deploy --dry-run --outdir=dist

      # 2026-06-12 code review: the three workers below had wrangler configs
      # and live consumers but were absent from CI build verification — a
      # wrangler-config break would not surface until a manual deploy.
      - name: Build Cost Anomaly Worker
        run: cd workers/cost-anomaly && npm ci && npx wrangler deploy --dry-run --outdir=dist

      - name: Build Cost Telemetry Worker
        run: cd workers/cost-telemetry && npm ci && npx wrangler deploy --dry-run --outdir=dist

      - name: Build Enrichment Workflow Worker
        run: cd workers/enrichment-workflow && npm ci && npx wrangler deploy --dry-run --outdir=dist
