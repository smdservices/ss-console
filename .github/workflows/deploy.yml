name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    # Only deploy when Cloudflare secrets are configured
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      deployments: write
      # Required so npm ci can fetch @venturecrane/crane-test-harness from
      # GitHub Packages via the workflow's GITHUB_TOKEN.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build
        run: npm run build

      # Dry-run catches wrangler config / binding errors before they hit prod.
      - name: Wrangler deploy (dry-run)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run

      # Migrations must be backward-compatible with the currently deployed
      # application. Apply them before publishing code that depends on them.
      - name: Run D1 migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ss-console-db --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Secrets persist across `wrangler deploy` on Workers — no post-deploy
      # sync step needed. Rotate out-of-band with:
      #   infisical export --env=prod --path=/ss --format=dotenv \
      #     | grep -vE '^(APP_|ADMIN_|PORTAL_|MEETING_|NEW_BUSINESS_|JOB_MONITOR_|REVIEW_MINING_|PUBLIC_)' \
      #     | npx wrangler secret bulk

      # The root `wrangler deploy` writes `.wrangler/deploy/config.json`
      # pointing at the adapter-generated `dist/server/wrangler.json`.
      # Sub-worker deploys discover it when searching upward and fail with
      # "Found both a user configuration file and a deploy configuration
      # file." Remove before subsequent sub-worker steps.
      - name: Clean root wrangler state
        run: rm -rf .wrangler

      - name: Install Job Monitor Worker deps
        run: cd workers/job-monitor && npm ci

      - name: Deploy Job Monitor Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/job-monitor
          command: deploy

      - name: Install Review Mining Worker deps
        run: cd workers/review-mining && npm ci

      - name: Deploy Review Mining Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/review-mining
          command: deploy

      # 2026-06-12 code review: the three workers below were absent from the
      # deploy pipeline — code changes shipped to neither CI verification nor
      # production without a manual deploy. enrichment-workflow is service-
      # bound from the main Worker (live intake path); the cost workers feed
      # the admin cost views.
      - name: Install Cost Anomaly Worker deps
        run: cd workers/cost-anomaly && npm ci

      - name: Deploy Cost Anomaly Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cost-anomaly
          command: deploy

      - name: Install Cost Telemetry Worker deps
        run: cd workers/cost-telemetry && npm ci

      - name: Deploy Cost Telemetry Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cost-telemetry
          command: deploy

      - name: Install Enrichment Workflow Worker deps
        run: cd workers/enrichment-workflow && npm ci

      - name: Deploy Enrichment Workflow Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/enrichment-workflow
          command: deploy
