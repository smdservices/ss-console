# Operator safety substrate CI.
#
# Closes the gap the harness-pivot review flagged: the Python safety-substrate
# invariants (trust-ceiling enforcement incl. the ADR 0025 exposure rules, the
# citation/no-fabrication invariants, sticky-stop, isolation) and the adapter
# tests (audit log, inbound trust boundary, namespace assertion) were NOT run
# in CI — only locally. This workflow gates them on every PR that touches the
# substrate, so a trust-gate regression cannot merge green.
#
# Two runners, because the suite is intentionally dual-mode:
#   * run()-style invariants (test_invariant_*.py with a `def run()` +
#     __main__ that exits non-zero on failure) are executed directly;
#   * pytest-style tests (adapter/tests, the pytest invariants, the inbound
#     boundary test) are collected by pytest.

name: operator-substrate

on:
  pull_request:
    paths:
      - 'operator/adapter/**'
      - 'operator/bin/**'
      - 'operator/safety-substrate/**'
      - 'operator/connectors/**'
      - 'operator/contracts/overlay-pairs.json'
      - 'operator/contracts/runtime-controls.yaml'
      - 'operator/contracts/overlay-hook-surface.json'
      - 'operator/templates/Dockerfile'
      - '.github/workflows/operator-substrate.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  substrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '>=3.11'

      - name: Install pytest
        # PyYAML is needed by the workspace-broker tests (the broker reads
        # authored customer.yaml to validate impersonation subject + send-as).
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Run run()-style safety invariants
        working-directory: operator
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for f in safety-substrate/tests/test_invariant_*.py; do
            # Only the pure run()-style files (top-level def run(), no pytest
            # import); pytest-style invariants are covered by the pytest step.
            if grep -q '^def run()' "$f" && ! grep -q 'import pytest' "$f"; then
              echo "== invariant: $f =="
              if ! python3 "$f"; then
                echo "FAILED: $f"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Run pytest suites (adapter + evidence + pytest-style invariants)
        working-directory: operator
        # bin/tests entries are named explicitly: some of bin/tests needs
        # substrate deps (pyyaml etc.) not installed in this bare-pytest env;
        # the named files import only stdlib + adapter/bin.lib modules.
        # test_decommission.py + test_seam_pull.py joined the list with #1355
        # (the decommission data-plane fix) — they previously ran nowhere in CI.
        run: python3 -m pytest adapter/tests adapter/evidence/tests adapter/voice/tests safety-substrate/tests bin/tests/test_voice_corpus.py bin/tests/test_deploy_ordering.py bin/tests/test_env_contract_conformance.py bin/tests/test_env_array_generation.py bin/tests/test_customer_yaml_block_conformance.py bin/tests/test_runtime_control_conformance.py bin/tests/test_decommission.py bin/tests/test_seam_pull.py bin/tests/test_verify_overlay_pairs.py workspace_broker/tests -q

      # SEC-32: overlay-RUNTIME side of the adapter <-> overlay drift gate.
      #
      # The vitest gate (tests/operator-overlay-pairs.test.ts) runs in the
      # hermetic `verify` workflow and can only hash the dormant ss-console-side
      # `operator/adapter/*` copies. That left a hole: a neutered RUNTIME file
      # (e.g. a no-op audit emitter in the overlay) shipped green because the
      # adapter copy was untouched and its hash still matched.
      #
      # This step closes it. The overlay is a PUBLIC repo pinned at the
      # manifest's overlayRef (which the vitest gate asserts equals the
      # Dockerfile ARG OVERLAY_REF). Here — where network is available — we
      # fetch it at that ref and assert every runtime twin's sha256 equals the
      # manifest's overlaySha256. A runtime change with no matching manifest
      # bump FAILS. Fail-closed: mismatch/missing/malformed -> exit 1; a genuine
      # fetch failure -> exit 2 (env), and the workflow still fails.
      - name: Verify overlay runtime hashes (SEC-32 drift gate)
        run: python3 operator/bin/verify-overlay-pairs.py

      # Author-built MCP connector conformance. The bare pytest env above
      # deliberately installs only pytest+pyyaml; the connector conformance suite
      # spawns a real stdio MCP server and speaks the protocol, so it needs the
      # `mcp` SDK and the connector itself installed. We build each connector's
      # OWN venv here — exactly as operator/templates/Dockerfile does — so CI
      # tests the real shipped artifact (the venv + `<name>-mcp` console-script),
      # not a source-tree import. Per-connector venv = the same isolation the
      # image gets.
      - name: Set up uv (connector venvs)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Author-built connector conformance
        working-directory: operator/connectors
        run: |
          set -euo pipefail
          # SDK unit tests once, in their own venv.
          uv venv /tmp/sdkv
          uv pip install --python /tmp/sdkv/bin/python ./_sdk pytest
          /tmp/sdkv/bin/python -m pytest _sdk/tests -q
          # Each connector: isolated venv with the shared SDK + itself, run its
          # tests with the console-script on PATH so the live stdio round-trip
          # exercises the real `<name>-mcp` entry point.
          for cdir in */; do
            name="${cdir%/}"
            [ "$name" = "_sdk" ] && continue
            [ -f "${cdir}pyproject.toml" ] || continue
            echo "== conformance: ${name} =="
            venv="/tmp/connv-${name}"
            uv venv "$venv"
            uv pip install --python "$venv/bin/python" ./_sdk "$cdir" pytest
            PATH="$venv/bin:$PATH" "$venv/bin/python" -m pytest "${cdir}tests" -q
          done
