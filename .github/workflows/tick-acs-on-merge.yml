name: Tick ACs on PR merge

# Caller for the canonical reusable workflow hosted in crane-console.
# See https://github.com/venturecrane/crane-console/blob/main/docs/runbooks/ac-tick-workflow-rollout.md

on:
  pull_request:
    types: [closed]

jobs:
  tick:
    uses: venturecrane/crane-console/.github/workflows/tick-acs-on-merge-reusable.yml@a89c747370c3804a3e2e38d5410855b9f73e0147 # tick-acs-v1
    permissions:
      issues: write
      pull-requests: write
      contents: read
