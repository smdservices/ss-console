# SMD Services — Cloudflare Workers + Static Assets
# Single Worker serving marketing (smd.services), admin (admin.smd.services),
# and portal (portal.smd.services) via Astro SSR middleware.
#
# Custom domains (added in the Cloudflare dashboard → Workers & Pages → ss-web
# → Domains → Custom Domain):
#   smd.services         — marketing site (public pages)
#   admin.smd.services   — admin console
#   portal.smd.services  — client portal
#
# All three hostnames hit this single Worker. Subdomain routing happens in
# src/middleware.ts via hostname inspection.

name = "ss-web"
# No `main` override here — the @astrojs/cloudflare adapter writes
# `dist/server/wrangler.json` with `main = "entry.mjs"` and that file is
# what `wrangler deploy` ultimately consumes (via `.wrangler/deploy/config.json`
# pointing at the dist/server config).
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ---------- Static assets ----------
# The @astrojs/cloudflare v13 adapter emits the Astro client build to dist/
# and a Worker entry resolved from the `main` module specifier above. The
# Worker must run first on every request for subdomain rewriting + session
# middleware to execute — otherwise the asset binding would short-circuit
# `/` before the Astro SSR handler sees it.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# ---------- Public env vars ----------
# Canonical origins for outbound links and webhook callbacks. Built from
# these env vars — never from the inbound request host (see
# src/lib/config/app-url.ts and issue #173).
#
# Unlike Pages, Workers treats [vars] and secrets as independent namespaces.
# `wrangler deploy` does NOT touch secrets set via `wrangler secret put`, so
# the Pages-era sync-pages-secrets.sh workaround is no longer needed.
[vars]
APP_BASE_URL = "https://smd.services"
ADMIN_BASE_URL = "https://admin.smd.services"
PORTAL_BASE_URL = "https://portal.smd.services"
MEETING_URL = "https://zoom.us/j/4284801619"

# Generator worker endpoints — invoked by /admin/generators "Run now" button.
# Bearer-authed via LEAD_INGEST_API_KEY (secret). Set via `wrangler secret put`.
NEW_BUSINESS_WORKER_URL = "https://ss-new-business.automation-ab6.workers.dev"
JOB_MONITOR_WORKER_URL = "https://ss-job-monitor.automation-ab6.workers.dev"
REVIEW_MINING_WORKER_URL = "https://ss-review-mining.automation-ab6.workers.dev"
SOCIAL_LISTENING_WORKER_URL = "https://ss-social-listening.automation-ab6.workers.dev"

# Feature flag for the public /patterns aggregate page. Off by default.
# Flip to "1" or "true" only after the unlock condition documented in
# src/pages/patterns.astro is met (>=20 real assessments with cross-vertical
# diversity, per CLAUDE.md no-fabrication rule). Any other value keeps the
# page returning 404.
ENABLE_PUBLIC_PATTERNS = "0"

# ---------- D1 (structured data) ----------
[[d1_databases]]
binding = "DB"
database_name = "ss-console-db"
database_id = "65171b23-d615-42a7-84e7-a4fac20d063c"

# ---------- R2 (documents, transcripts, SOWs) ----------
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "ss-console-storage"

# ---------- R2 (consultant photos, public) ----------
# Intended to be a public bucket — object URLs are served directly to the
# portal. Create with: npx wrangler r2 bucket create smd-consultant-photos
# Then enable public access in the Cloudflare dashboard and set the resulting
# public base URL via: npx wrangler secret put CONSULTANT_PHOTOS_PUBLIC_BASE
[[r2_buckets]]
binding = "CONSULTANT_PHOTOS"
bucket_name = "smd-consultant-photos"

# ---------- R2 (operator customer-config, authoritative live config) ----------
# Per-customer Operator config + voice vaults. This is the same bucket the
# provisioning scripts use (R2_BUCKET_CONFIG, default `smd-customer-config` —
# see operator/bin/provision-customer.sh and docs/runbooks/operator/first-boot.md).
# The console apply path (src/lib/operator/apply-config.ts) writes the live
# config at `vaults/<slug>/customer.yaml` and a byte-snapshot at
# `customers/<slug>/history/<digest>.yaml`. The on-Machine root applier pulls
# the live key from R2 — R2 is the source of truth for live reconfig.
[[r2_buckets]]
binding = "CUSTOMER_CONFIG"
bucket_name = "smd-customer-config"

# ---------- Service binding to enrichment-workflow Worker ----------
# Cloudflare Workflows orchestration for entity enrichment lives on its
# own Worker (`ss-enrichment-workflow`, see `workers/enrichment-workflow/`).
# #631 was opened after the 2026-04-30 measurement found 86% of created
# entities had no enrichment activity — the legacy
# `ctx.waitUntil(enrichEntity(...))` path was being killed by Workers'
# post-response CPU budget on lead-gen ingest batches.
#
# This binding lets the 7 trigger sites (lead-gen workers + admin
# endpoints) dispatch enrichment via:
#
#   env.ENRICHMENT_WORKFLOW_SERVICE.fetch('https://internal/dispatch', {
#     method: 'POST',
#     body: JSON.stringify({ entityId, orgId, mode, triggered_by }),
#   })
#
# The target Worker creates a Workflow instance and returns the instance id.
[[services]]
binding = "ENRICHMENT_WORKFLOW_SERVICE"
service = "ss-enrichment-workflow"

# ---------- Workers KV (sessions) ----------
[[kv_namespaces]]
binding = "SESSIONS"
id = "4570dcc1e154476f889bc9fcfc28b2b9"

# ---------- Workers KV (rate-limit + session ceilings) ----------
# Used by /api/booking/reserve for IP-based rate limiting, and by
# /api/assessment/turn for the per-session turn/cost ceiling that gates the
# public live assessment (see src/lib/assessment/session.ts). No new namespace
# is needed for assessment hardening — it reuses this bucket with `as:turns:*`
# keys. No slot cache in v1 (see plan §No availability cache in v1).
[[kv_namespaces]]
binding = "BOOKING_CACHE"
id = "daf6a3220f8f42f28f3da7e82f663088"

# ---------- Observability ----------
[observability]
enabled = true

# ---------- Audit-log Logpush mirror (per docs/specs/operator/audit-log-immutability.md) ----------
# Issue #892. The per-customer Operator audit_log table is mirrored to an
# immutable R2 archive bucket with bucket-level Object Lock. Even a compromised
# Worker cannot delete a row from an Object-Lock bucket inside the retention
# window. The mirror is the compliance-grade copy that the periodic integrity
# check (operator/adapter/audit_log_integrity.py) compares against the D1
# rows.
#
# This block is forward-config: the bucket lives on the per-customer Hermes
# Worker (hermes-{slug}), not on ss-web. Migration 0002 documents the
# Hermes-side wrangler.toml fragment; this block declares the canonical
# bucket-naming pattern + retention defaults so the provisioner script
# (bin/provision-customer.sh, owned by issue #800 follow-on) configures every
# new customer's Logpush sink to the same shape.
#
# Bucket naming: smd-audit-archive-{customer_slug}
#   Object key: {YYYY}/{MM}/{DD}/{ulid}.json
#   Object Lock: Compliance Mode (cannot be unlocked by account admin)
#   Retention: law=7y, default=3y (set per-vertical at bucket create time)
#
# The Logpush job filters for INSERT statements against audit_log only. The
# Worker-layer wrapper (D1Executor) rejects UPDATE/DELETE; if the wrapper is
# ever bypassed, the integrity check surfaces drift between D1 and the mirror
# at the next run.
#
# To wire the real LogpushMirror implementation when Hermes-side deployment
# lands, replace NoopLogpushMirror in audit_log.py wiring with the R2-backed
# implementation that POSTs to the bucket above. The Protocol shape is fixed —
# the swap is one constructor argument.
#
# [audit_log_mirror]
# bucket_pattern = "smd-audit-archive-{slug}"
# object_lock_mode = "compliance"
# retention_days_default = 1095   # 3 years
# retention_days_law = 2555       # 7 years
# logpush_cadence_seconds = 60
# integrity_check_cron = "0 * * * *"

# ---------- Staging environment ----------
# Used for pre-cutover validation on a workers.dev hostname. Deploy with:
#   wrangler deploy --env staging
# Reuses prod bindings (same D1/R2/KV) — flip to separate resources when we
# need data isolation for staging.
[env.staging]
name = "ss-web-staging"

# ---------- Secrets (set via `wrangler secret put` or `wrangler secret bulk`) ----------
# All secrets are set per-Worker. Persist across `wrangler deploy` natively —
# no sync script needed.
#
# RESEND_API_KEY          — Resend transactional email
# ANTHROPIC_API_KEY       — Claude API (outreach gen, website analysis, dossier)
# GOOGLE_PLACES_API_KEY   — Google Places Text Search (enrichment)
# OUTSCRAPER_API_KEY      — Outscraper business profile + email enrichment
# SERPAPI_API_KEY         — SerpAPI Google Search (news/press enrichment)
# LEAD_INGEST_API_KEY     — Bearer token for pipeline Worker ingestion
# SIGNWELL_API_KEY        — SignWell e-signature
# SIGNWELL_WEBHOOK_SECRET — SignWell webhook verification
# STRIPE_API_KEY          — Stripe invoicing
# STRIPE_WEBHOOK_SECRET   — Stripe webhook verification
# PROXYCURL_API_KEY       — LinkedIn company data (optional, Tier 4 dossier)
# SENTRY_DSN               — Workers-side Sentry error monitoring (optional —
#                            integration is a no-op when unset; see
#                            src/lib/observability/sentry.ts)
#
# Booking system (Calendly replacement) — added in migration 0011 era:
# GOOGLE_CLIENT_ID         — Google Cloud OAuth 2.0 client ID
# GOOGLE_CLIENT_SECRET     — Google Cloud OAuth 2.0 client secret
# BOOKING_ENCRYPTION_KEY   — 32-byte base64 random; AES-GCM encryption of refresh tokens
#
# Operator runtime read (ADR 0043 path A):
# OPERATOR_RUNTIME_READ_URL    — host template for the console→Machine read
#                                (e.g. https://{app}.fly.dev); enables the path
# OPERATOR_RUNTIME_READ_SECRET — master from which each Machine's per-customer
#                                read key is derived (HMAC-SHA256(master, slug));
#                                lives ONLY here, never on a Machine
#
# Bulk-load from Infisical:
#   infisical export --env=prod --path=/ss --format=dotenv \
#     | grep -vE '^(APP_|ADMIN_|PORTAL_|MEETING_|NEW_BUSINESS_|JOB_MONITOR_|REVIEW_MINING_|PUBLIC_)' \
#     | npx wrangler secret bulk
