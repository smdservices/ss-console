[pytest]
# importlib mode keeps per-skill `pre_run.py` modules from colliding
# at import time. Without it, the first `pre_run.py` to be imported
# claims the bare `pre_run` module name and subsequent skill tests
# get the wrong module's symbols. See ADR 0021 Stream B (#1062, #1070).
addopts = --import-mode=importlib
testpaths = skills tests safety-substrate
