# ============================================================================
# Operator env-consumption contract — the SINGLE SOURCE OF TRUTH for what each
# environment variable is, where it is consumed, and whether it survives into
# the long-running agent process.
# ============================================================================
#
# WHY THIS EXISTS. Every Operator deploy used to surprise us because one fact —
# "what reads this var" — lived in someone's head, separate from the tooling
# that provisions/strips/requires it, and the two drifted. That is how voice
# broke: Phase 1 security stripped the account-wide R2 key from the agent env,
# not knowing the voice plugin read it (OP-P0-2). This file makes that fact
# explicit and machine-checkable, so the drift becomes a failed check instead of
# a live incident.
#
# ENFORCEMENT (all derived from THIS file):
#   1. Boot-time, fail-closed (operator/safety-substrate/tests/test_invariant_9_*):
#      the headline guard — NO var marked `stage: agent` may be `agent_env:
#      stripped`. You cannot strip a credential the agent needs. Runs in the
#      image (where this contract is COPY'd) at bootstrap Step 8, before the
#      gateway starts. This is a STATIC consistency check (no live-env probe, no
#      grep) so it cannot false-positive and brick a healthy Machine.
#   2. CI, ss-console (tests/operator-env-contract.test.ts): the contract's
#      `required`/`optional`/`stripped` facts MATCH bootstrap.sh's REQUIRED_ENV /
#      OPTIONAL_ENV arrays and the actual `unset`/strip sites. Drift = red check.
#
# FIELDS (per var):
#   stage:       where the value is CONSUMED. One of:
#                  provisioning-host  - the laptop running provision-customer.sh; never reaches the Machine
#                  image-build        - a Docker ARG/build-time value
#                  boot               - read by entrypoint.sh / bootstrap.sh before the agent starts
#                  agent              - read by the long-running gateway or an overlay plugin
#                  broker             - read by the uid-split Workspace broker process
#                  mcp-subprocess     - read by an MCP connector subprocess the agent spawns
#   requirement: required | optional   (required => boot dies if absent)
#   agent_env:   held | stripped | n/a
#                  held     - present in the agent process env
#                  stripped - explicitly unset before the gateway exec (must NOT be stage:agent)
#                  n/a      - never on the Machine (provisioning-host / image-build)
#   strip_site:  (only when agent_env: stripped) the file that unsets it
#   custody:     infra | customer
#                  infra    - operator/SMD-owned (R2, Fly, Sentry, HMAC masters,
#                             bucket names, D1 bindings). Safe to be REAL — or
#                             emulated — during a keyless build; the operator
#                             holds it regardless of which customer is provisioning.
#                  customer - carries (or grants access to) a specific customer's
#                             world: their model key, their connector OAuth creds,
#                             their inbox/webhook secrets, their Google identity.
#                             MUST enter only at handoff through a door we never
#                             see (portal relay / Captain go-live). A keyless build
#                             sees only a placeholder; staging/keyless runs must
#                             NOT borrow the live value. `GOOGLE_*` is customer-by-
#                             EFFECT (DWD impersonation), so staging substitutes an
#                             isolated credential rather than the live one.
#   note:        free text
#
# Adding a consumer? Add/update the var here FIRST. If a plugin needs a var at
# `stage: agent`, it must be `agent_env: held` — the boot invariant enforces it.
# Every var MUST carry a `custody` class — operator/bin/lib/secret_custody.py and
# its completeness test fail closed on an unclassified provisioning secret, which
# is what keeps the keyless-build placeholder allowlist complete.

vars:
  # ---- Agent-held credentials/config (the long-running gateway + overlay plugins) ----
  ANTHROPIC_API_KEY:
    stage: agent
    requirement: required
    agent_env: held
    custody: customer
    note: the gateway's model credential (per-seat Anthropic workspace key or BYO key)
  SMD_D1_AUDIT_BINDING:
    stage: agent
    requirement: required
    agent_env: held
    custody: infra
    note: hermes-smd-audit D1 binding (path or var-name indirection)
  SMD_D1_AGENT_STATE_BINDING:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: mutable agent-state binding (agent_skills_inventory) from fly.toml [env]; falls back to SMD_D1_AUDIT_BINDING when unset (OP-P1-4 ledger/state split)
  SMD_AUDIT_BROKER_SOCKET:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: from fly.toml [env]; set => overlay routes audit writes through the broker's append-only audit_append (OP-P1-4); the broker-side ledger path (SMD_AUDIT_DB_PATH) is entrypoint-computed and broker-only, like SMD_WORKSPACE_BROKER_SOCKET
  R2_SKILL_BODIES_BUCKET:
    stage: agent
    requirement: required
    agent_env: held
    custody: infra
    note: bucket NAME (not a credential) from fly.toml [env]; skill_capture target
  R2_ENDPOINT_URL:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: endpoint URL (NOT a credential) read by skill_capture + the voice reader path; intentionally kept across the R2 strip
  SMD_VOICE_VAULT_DIR:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: local voice-vault dir set by bootstrap Step 2a; the voice plugin reads samples from here so the agent holds NO R2 credential (OP-P0-2)
  SMD_SPEC_DIR:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: >-
      ss ADR 0083 / #2084. Root-owned directory holding the customer's authored
      per-output-class specs plus root's manifest of them, set by entrypoint.sh to
      ${CONFIG_DIR}/specs and installed by the spec_applier before the privilege
      drop. Held (not stripped) because the agent MUST read it: the trust plugin
      marks a verified spec read from it and the read-mark is what an expected-spec
      send gate consults. Reading is the ONLY access the agent has — the dir is
      root:root 0755 / files 0644 and the spec_dir_ownership boot check refuses to
      serve if that ever stops being true, because read_file is unfenced and does
      not taint, so an agent-WRITABLE spec would be a persistent, untainted,
      self-authored prompt-injection channel surviving restarts. custody: infra —
      the value is a path this operator chooses, not customer material; the
      customer's authored prose lives at the path, delivered through the R2 vault
      object under the operator's own credential.
  R2_SKILL_BODIES_ACCESS_KEY_ID:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: bucket-SCOPED token for agent-authored skill persistence; OFF by default; NEVER the account-wide pair
  R2_SKILL_BODIES_SECRET_ACCESS_KEY:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: paired with R2_SKILL_BODIES_ACCESS_KEY_ID

  # ---- Boot-stage credentials: read before the agent, then STRIPPED ----
  R2_ACCESS_KEY_ID:
    stage: boot
    requirement: required
    agent_env: stripped
    strip_site: operator/templates/bootstrap.sh
    custody: infra
    note: ACCOUNT-WIDE R2 key; read by the customer.yaml fetch (Step 2) + voice-vault sync (Step 2a); unset before gateway exec (OP-P0-2)
  R2_SECRET_ACCESS_KEY:
    stage: boot
    requirement: required
    agent_env: stripped
    strip_site: operator/templates/bootstrap.sh
    custody: infra
    note: paired with R2_ACCESS_KEY_ID
  R2_BUCKET_CONFIG:
    stage: boot
    requirement: required
    agent_env: held
    custody: infra
    note: config-bucket NAME (not a credential); fly.toml [env]; used by the boot fetches and is harmless in the agent env

  # ---- Broker-stage credentials: read by the uid-split broker, unset for the agent ----
  GOOGLE_SERVICE_ACCOUNT_JSON:
    stage: broker
    requirement: optional
    agent_env: stripped
    strip_site: operator/templates/entrypoint.sh
    custody: customer
    note: DWD service-account key; customer-by-EFFECT (impersonates the seat's authored subject); only the workspace-broker process decodes it; unset for the gateway. Staging SUBSTITUTES an isolated cred (gen-staging-google-cred.py), never the live one.
  GOOGLE_TOKEN_JSON:
    stage: broker
    requirement: optional
    agent_env: stripped
    strip_site: operator/templates/entrypoint.sh
    custody: customer
    note: legacy user-OAuth token; grants the customer's own Google; broker-only
  GOOGLE_CLIENT_SECRET_JSON:
    stage: broker
    requirement: optional
    agent_env: stripped
    strip_site: operator/templates/entrypoint.sh
    custody: customer
    note: broker-only OAuth client secret for the customer's Google app

  # ---- MCP-subprocess credentials (passed only into the connector subprocess env) ----
  CLIO_CLIENT_ID:
    stage: mcp-subprocess
    requirement: optional
    agent_env: held
    custody: customer
    note: Clio MCP connector; materialized into the mcp_servers subprocess env when the customer binds Clio
  CLIO_CLIENT_SECRET:
    stage: mcp-subprocess
    requirement: optional
    agent_env: held
    custody: customer
    note: paired with CLIO_CLIENT_ID

  # ---- Optional agent observability / Phase-2 forward-compat ----
  SMD_D1_OBSERVATIONS_BINDING:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: Honcho observations mirror; inert in Phase 1 (ADR 0016 revised)
  HONCHO_API_KEY:
    stage: agent
    requirement: optional
    agent_env: held
    custody: infra
    note: Honcho inferred-memory; inert in Phase 1
  AGENTMAIL_API_KEY:
    stage: agent
    requirement: optional
    agent_env: held
    custody: customer
    note: >-
      AgentMail READ/DRAFT credential for the gateway. Inbox-scoped with
      message_send and draft_send WITHHELD (ss#2258), so it is deliberately
      agent-held: the agent needs it for the MCP mailbox reads and the draft
      tools the reply channel triggers on, and the vendor refuses if any code
      path tries to transmit with it. Transmit rides AGENTMAIL_SEND_API_KEY,
      which is broker-only.
  AGENTMAIL_SEND_API_KEY:
    stage: broker
    requirement: optional
    agent_env: stripped
    strip_site: operator/templates/entrypoint.sh
    custody: customer
    note: >-
      AgentMail SEND credential; inbox-scoped WITH message_send. Only the
      workspace-broker process reads it (from a 0600 file it materializes at
      boot), and it is unset before the exec-drop so no hermes-uid process ever
      has it in environ — ADR 0044 D8 proved a same-uid sibling can read
      /proc/<pid>/environ, so the strip has to precede the first fork. Every
      send using it passes the broker's recipient fence and leaves an audit row.

  # ---- Microsoft Graph mail (ADR 0078), the OTHER mail channel ----
  # Declared here because the split below is the whole point and is easy to
  # misread as an oversight: the READ family stays agent-held while the SEND
  # family is broker-only and stripped. That asymmetry is forced by the vendor.
  # A Graph app-only token is always `/.default` — every application permission
  # the app registration holds — so there is no send-incapable variant of the
  # credential the agent needs for the delta poller and its mail tools. The
  # AgentMail channel gets a vendor fence for free; this one does not, and the
  # only thing that buys it is a SECOND app registration (read-only for the
  # agent, send-capable only for the broker), which is a tenant-admin action.
  MSGRAPH_TENANT_ID:
    stage: agent
    requirement: optional
    agent_env: held
    custody: customer
    note: Graph READ app tenant id; the delta poller and msgraph-mail MCP server read it.
  MSGRAPH_CLIENT_ID:
    stage: agent
    requirement: optional
    agent_env: held
    custody: customer
    note: Graph READ app client id (consented into the customer's tenant).
  MSGRAPH_CLIENT_SECRET:
    stage: agent
    requirement: optional
    agent_env: held
    custody: customer
    note: >-
      Graph READ app secret. Agent-held DELIBERATELY: the inbound delta poller
      runs in the gateway and the msgraph-mail MCP server is the agent's own mail
      tool surface, so stripping it would blind the seat rather than harden it.
      Until a send-only app registration exists this same credential can also
      POST /sendMail, which is the residual ss#2258 names rather than hides.
  MSGRAPH_MAILBOX:
    stage: agent
    requirement: optional
    agent_env: held
    custody: customer
    note: >-
      The pinned operator mailbox for the READ path. The broker does NOT read
      this — it takes the mailbox from customer.yaml, so a secret cannot
      contradict the authored config about who the seat sends as.
  MSGRAPH_SEND_TENANT_ID:
    stage: broker
    requirement: optional
    agent_env: stripped
    strip_site: operator/templates/entrypoint.sh
    custody: customer
    note: Graph SEND app tenant id; broker-only (0600 file materialized at boot).
  MSGRAPH_SEND_CLIENT_ID:
    stage: broker
    requirement: optional
    agent_env: stripped
    strip_site: operator/templates/entrypoint.sh
    custody: customer
    note: >-
      Graph SEND app client id; broker-only. While this equals MSGRAPH_CLIENT_ID
      the seat is on the migration fallback and only the GOVERNED send path is
      fenced; the provisioner logs that state explicitly when it stages them.
  MSGRAPH_SEND_CLIENT_SECRET:
    stage: broker
    requirement: optional
    agent_env: stripped
    strip_site: operator/templates/entrypoint.sh
    custody: customer
    note: >-
      Graph SEND app secret. Only the workspace-broker process reads it, and it
      is unset before the exec-drop so no hermes-uid process has it in environ
      (ADR 0044 D8: a same-uid sibling can read /proc/<pid>/environ, so the strip
      must precede the first fork). Every send using it passes the broker's
      recipient fence and leaves an audit row the broker writes itself.

  # ---- Provisioning-host only (never reach the Machine) ----
  OPERATOR_RUNTIME_READ_SECRET:
    stage: provisioning-host
    requirement: optional
    agent_env: n/a
    custody: infra
    note: HMAC seed used at provisioning to derive the per-customer OPERATOR_RUNTIME_READ_KEY; never staged to the Machine
  CF_API_TOKEN:
    stage: provisioning-host
    requirement: optional
    agent_env: n/a
    custody: infra
    note: Cloudflare token for R2 bucket creation at provisioning; never staged
