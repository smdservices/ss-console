      Portal entitlement dial (ss#2003 Q7, agreement §2.4-2.5): Named
      Administrator changes a routine's tier in the portal -> console compiles
      to per-action-class ceilings (letter ceiling + vertical floor
      non-raisable) -> gate POST /entitlement/set (console-proxy bearer, same
