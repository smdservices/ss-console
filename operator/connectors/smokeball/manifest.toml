# mcp:smokeball — author-built connector for the Smokeball practice-management
# API (the law-firm wedge system of record). ADR 0053.
#
# auth_model = client_credentials is the manifest DEFAULT; the pilot seat runs
# authorization_code (firm-delegated, ADR 0054) selected per-seat via
# customer.yaml, with the refresh token minted under the approved app whose
# STAGING credentials are the SMOKEBALL_STAGING_* vault pair. client_credentials
# remains supported and is what the rehearsal-office seeder uses — on App 1's
# separate SMOKEBALL_SEED_* creds (operator/customers/pilot-smokeball/seed/),
# never this seat's pair.
#
# required_secrets are the RUNTIME env-var names the connector reads; the overlay
# registry remaps them from the vault names (SMOKEBALL_STAGING_* in /ss). Every
# API call carries x-api-key (SMOKEBALL_API_KEY) + Authorization: Bearer.
#
# tool_classes is the conformance ORACLE: every entry must agree with the
# hand-authored overlay map (shared/action_classes.py) under the runtime name
# mcp_smokeball_<tool>. The surface is the reads (including read_document,
# the server-side presigned fetch + text extraction that makes matter
# documents readable as DATA — added 2026-07-05 after the L2 DISC-1 finding
# that no tool could fetch what get_download_url mints) + create_memo
# (internal_write) + the document round-trip writes add_file (internal_write)
# and delete_file (destructive, taint-gated) + the deadline-engine /
# document-organization write cut: create_event/update_event/
# create_event_reminder, create_task/update_task, and create_folder (all
# internal_write). The trust-account fund-movement tools are NEVER exposed
# here and are hard-BANNED at the overlay.
#
# COORDINATED CHANGE: the matching shared/action_classes.py entries in
# hermes-smd-overlay (mcp_smokeball_create_event etc. = internal_write;
# list_events / list_folders = read) MUST land for the overlay manifest<=map
# conformance test to stay green and for these writes to be governed at runtime.
#
# COORDINATED CHANGE (render_docx_template): same shape, one entry —
# mcp_smokeball_render_docx_template = ActionClass.INTERNAL_WRITE in
# hermes-smd-overlay shared/action_classes.py, plus an OVERLAY_REF bump at
# deploy. Until that entry lands the tool is UNREACHABLE at runtime (an
# unclassified tool is refused, not defaulted), which is the fail-closed
# direction: the .docx renderer writes a template into the firm's own record and
# sends nothing outside the firm, so internal_write is its class.
[connector]
name = "smokeball"
capability = "PracticeManagement"
auth_model = "client_credentials"
description = "Smokeball practice-management API connector (law wedge system of record)."

[connector.env_static]
SMOKEBALL_REGION = "us"
SMOKEBALL_ENVIRONMENT = "staging"

[[connector.required_secrets]]
runtime_env = "SMOKEBALL_CLIENT_ID"
purpose = "OAuth client id (client_credentials grant). Remapped from SMOKEBALL_STAGING_CLIENT_ID."

[[connector.required_secrets]]
runtime_env = "SMOKEBALL_CLIENT_SECRET"
purpose = "OAuth client secret. Remapped from SMOKEBALL_STAGING_CLIENT_SECRET."

[[connector.required_secrets]]
runtime_env = "SMOKEBALL_API_KEY"
purpose = "The x-api-key header value (identifies the app on every request). Remapped from SMOKEBALL_STAGING_API_KEY."

[connector.tool_classes]
auth_status = "read"
list_matters = "read"
get_matter = "read"
list_matter_types = "read"
get_stage_sets = "read"
get_stage_to_matter_mappings = "read"
get_contacts = "read"
get_contact = "read"
get_contact_relations = "read"
list_tasks = "read"
get_task = "read"
create_task = "internal_write"
update_task = "internal_write"
list_events = "read"
create_event = "internal_write"
update_event = "internal_write"
create_event_reminder = "internal_write"
search_staff = "read"
get_staff = "read"
get_roles_on_matter = "read"
get_relationships_on_matter = "read"
get_files_on_matter = "read"
get_file = "read"
get_download_url = "read"
read_document = "read"
list_folders = "read"
create_folder = "internal_write"
add_file = "internal_write"
file_attachment_to_matter = "internal_write"
render_docx_template = "internal_write"
delete_file = "destructive"
get_memos_on_matter = "read"
get_bank_accounts = "read"
get_matter_balances = "read"
get_matter_billing_config = "read"
get_fees = "read"
get_expenses = "read"
get_webhook_subscriptions = "read"
get_event_types = "read"
create_webhook_subscription = "internal_write"
create_memo = "internal_write"
