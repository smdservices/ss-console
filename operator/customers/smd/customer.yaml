schema_version: 1

# SMD Services customer Operator.
#
# AUTHORED by the aie-onboard skill (2026-05-31) from the REAL onboarding interview
# at operator/customers/smd/onboarding-interview-2026-05-31.md. This REPLACES the
# prior config, which was seeded from a test fixture (aie-onboard test-cases.md Case 1)
# and carried the wrong identity (venturecrane.com) for a long time.
#
# Every value below traces to a stated interview answer. Capabilities the substrate
# cannot yet honor are NOT encoded here — they live as open-items in onboarding-plan.md.
# Crane is provisioned as a customer Workspace employee. Google authority is a
# customer-owned service account with domain-wide delegation impersonating the
# Operator's Workspace user. A separate capability broker holds the credential;
# the gateway receives only short-lived grants for classified operations.
#
# Not provisioned, not committed by the skill. Captain reviews before either.

# ---- IDENTITY ----
customer_id: smd
customer_name: 'SMDurgan, LLC'
vertical: mixed # interview §Runtime; enum has no consulting/services value (#1141)
fly_region: lax # "We're in Phoenix" → closest Fly region

# ---- RUNTIME ----
# Interview wants TIERED models (routine: claude-sonnet-4-6, sensitive: claude-opus-4-8).
# The schema has a single `model:` string — per-task tiering is a schema gap (open-item).
# Set to the sensitive-tier default; drafting the principal's mail is sensitive work.
model: claude-opus-4-8
hermes_ref: v2026.5.16@a91a57fa5a13d516c38b07a141a9ce8a3daabeb0

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- GOOGLE WORKSPACE AUTHORITY ----
# Customer-owned Google Cloud service account with domain-wide delegation.
# GOOGLE_SERVICE_ACCOUNT_JSON is a Fly secret containing base64-encoded service
# account JSON. Only the separate Workspace broker process can decode or read it.
google_auth:
  mode: dwd
  subject: crane@smd.services
  scopes:
    - https://www.googleapis.com/auth/gmail.modify
    - https://www.googleapis.com/auth/calendar.events
    - https://www.googleapis.com/auth/drive
    - https://www.googleapis.com/auth/documents
    - https://www.googleapis.com/auth/spreadsheets
  # ---- MANAGED MAILBOX (executive-assistant access) ----
  # Crane manages the principal/team mailbox IN ADDITION to its own crane@ box,
  # the way an EA works a principal's inbox alongside their own. The DWD service
  # account impersonates smdurgan@smdurgan.com — the PRIMARY mailbox, where the
  # scott@/team@ aliases deliver (Google rejects impersonating an alias). The
  # broker fail-closes any impersonation subject or From not authored here.
  #
  # send_as is the Gmail "Send mail as" allowlist for the From header. Wave A is
  # DRAFT-ONLY: no Gmail send tool is wired, inbox-triage creates reply drafts
  # for Captain to send, and the principal-identity SEND ban below still holds
  # (a draft is not a send). Authoring autonomous send-as-principal is Wave B,
  # behind its own ADR + the audit/rate-limit/kill-switch controls.
  managed_mailboxes:
    - address: smdurgan@smdurgan.com
      send_as:
        - scott@smd.services
        - team@smd.services
        - smdurgan@smdurgan.com

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan
    # Real writing samples are an onboarding open-item; until then Layer 2 falls
    # back to general.
    voice_profile_id: scott

# ---- PERSONAS ----
# "I want to call the assistant Crane ... a Chief of Staff, not a secretary."
personas:
  - slug: crane
    status: active
    name: Crane
    title: Chief of Staff
    # "plainspoken and direct — executive-summary first ... keep it short."
    tone:
      - plainspoken
      - direct
      - executive-summary
      - concise
    # Inbox triage plus on-demand broker-mediated Workspace reads and writes.
    skills:
      - name: inbox-triage
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: workspace
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
    # Native Google/Himalaya skills remain disabled because this customer uses
    # broker-mediated first-class tools and the customer-owned DWD credential.
    skills_disabled:
      - google-workspace
      - himalaya
    # "reading what comes in ... hourly, 0700–1900 Phoenix."
    cron:
      - skill: inbox-triage
        schedule: '0 7-19 * * *' # hourly 0700–1900 (fly_region: lax tz)
        wake_policy: always

# ---- MCP CONNECTOR (Operator ⇄ Claude, Phase 1) ----
# Lets authored users reach this Operator from inside their own Claude
# (claude.ai / Claude Desktop) via the console-hosted MCP endpoint at
# https://smd.services/api/operator/smd/mcp. Console-side only — no Machine surface.
# Fail-closed: enabled:false (or an absent block) means no one connects; each
# access[] entry binds a users[] email to an active persona slug.
# See docs/design/operator/03-mcp-server-exposure.md.
mcp_connector:
  enabled: true
  # 'open' = the authored user reaches the Operator with no extra data fence
  # beyond the entitlement ceilings already in this config (Phase 1 posture).
  data_posture: open
  access:
    # Scott reaches Crane from his own Claude. This email MUST match both a
    # users[] entry above. clerk_subjects are the stable identities from the
    # Clerk accounts Scott may use for Claude; their emails may differ.
    - email: scott@smd.services
      profile: crane
      clerk_subjects:
        - user_3EEs0aMBRgu6PRxBa4g5YhHjggD
        - user_3E1RPGrTMxkSqciXMTyybUNSJWu

# ---- CONNECTORS ----
# Google Workspace rides first-class tools mediated by the ADR 0045 broker.
connectors:
  Email:
    adapter: google-gmail
    backend: build:google-gmail
    enabled: true
  Calendar:
    adapter: google-calendar
    backend: build:google-calendar
    enabled: true
  DocumentStorage:
    adapter: google-drive
    backend: build:google-drive
    enabled: true

# ---- TELEGRAM CHANNEL (ADR 0033) ----
# Crane is reachable on Telegram via Hermes' native polling adapter (getUpdates).
# No webhook/public surface. The bot TOKEN is the Fly
# secret TELEGRAM_BOT_TOKEN, which auto-enables the polling platform.
# The image must be built with the Dockerfile `--extra messaging` (python-telegram-bot);
# `--extra all` omits it.
#
# The ALLOWLIST below is the AUTHORED SOURCE OF TRUTH (not a loose Fly secret): the
# overlay translate.py _materialize_telegram_platform materializes it into the profile
# config.yaml `telegram:` block, which Hermes maps to TELEGRAM_ALLOWED_USERS.
# MANDATORY and fail-closed: the pinned Hermes ref allows ALL users when the allowlist
# is empty (telegram.py: `if not allowed_csv: return True`); the materializer raises on
# an empty allow_from, and the bootstrap guard (ensure-telegram-allowlist.py) refuses to
# launch if the token is set without a resolvable allowlist. Proven live 2026-06-01.
telegram:
  enabled: true
  # Permitted Telegram numeric user id(s). DM-only. 7367659986 = Scott Durgan.
  allow_from:
    - '7367659986'
  # 1:1 DM assistant: reply to every DM from an allowed user (no @mention needed).
  require_mention: false

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # Autonomous external sends act only on direction from trusted senders
  # (interview: smdurgan.com / smd.services). Untrusted/spoofed senders are
  # triaged only.
  trusted_sender_domains:
    - smdurgan.com
    - smd.services
  # ---- TRUST CEILINGS (per-action, ADR 0025) ----
  # Crane may send from its own AgentMail identity within the authored ceiling.
  # Sending from the principal Workspace identity remains permanently banned.
  action_ceilings:
    external_send: autonomous

# ---- ESCALATION ----
# "just flag it to me" → red flags + run failures go to the boss/escalation address.
escalation:
  red_flag_recipients:
    - team@smd.services
  failure_recipients:
    - team@smd.services

# ---- VOICE LIBRARY ----
# Deterministic R2 path. The principal supplied NO writing samples in the interview —
# sample collection is an open onboarding item (onboarding-plan.md Phase 1). Not fabricated.
voice_library:
  samples_path: 'r2://vaults/smd/voice/samples/'

# ---- MEMORY (per-customer isolation invariants; must match customer_id) ----
# Phase 1 runs on Hermes' flat-file memory core (MEMORY.md/USER.md). Inferred memory
# (Honcho) is deferred to Phase 2 — see ADR 0016 (revised 2026-05-30).
memory:
  d1_namespace: smd
  r2_vault_path: 'vaults/smd/'
  vectorize_index: 'hermes-smd-vault'

# ---- RELATIONSHIP (authored behavioral lane, ADR 0048) ----
# How each person here likes Crane to work with them. INFORMATIONAL ONLY: these
# shape how Crane drafts and helps and NEVER grant capability — entitlements live
# in scope/escalation and are enforced by trust_ceiling regardless of this text.
# Distinct from the style lane (voice_corrections): behavioral working
# preferences, not draft phrasing.
#
# Seeded from Scott's standing working preferences (documented working feedback);
# authored content, human-reviewed — not inferred or fabricated. Refine as the
# working relationship develops. Materialized into Crane's SOUL.md by the overlay
# and surfaced read-only on the admin relationship view.
relationship:
  people:
    - id: scott-durgan
      name: Scott Durgan
      role: Principal
      prefers:
        - 'Lead with the material change and its consequence; skip process and bookkeeping narration'
        - 'Decide what the context already determines; reserve questions for genuinely ambiguous calls'
        - 'Move fast with low ceremony; engage as a peer, surface real risk once, then proceed'
      avoid:
        - 'Inventing time or effort estimates for work that has not been scoped'
        - 'Relitigating a decision that has already been made'
