schema_version: 1

# SMD Services — customer-zero (internal "eat our own cooking" instance, ADR 0004 / #776).
#
# AUTHORED by the aie-onboard skill (2026-05-31) from the REAL onboarding interview
# at operator/customers/smd/onboarding-interview-2026-05-31.md. This REPLACES the
# prior config, which was seeded from a test fixture (aie-onboard test-cases.md Case 1)
# and carried the wrong identity (venturecrane.com) for a long time.
#
# Every value below traces to a stated interview answer. Capabilities the substrate
# cannot yet honor are NOT encoded here — they live as open-items in onboarding-plan.md.
# The biggest one: Crane has no outbound send transport yet (Gmail is modify-scope /
# never-send; AgentMail is unwired, deferred Phase 2). This config is therefore the
# buildable subset: inbox triage + draft-for-review, no autonomous sending.
#
# Not provisioned, not committed by the skill. Captain reviews before either.

# ---- IDENTITY ----
customer_id: smd
customer_name: 'SMDurgan, LLC'
vertical: mixed # interview §Runtime; enum has no consulting/services value (#1141)
fly_region: lax # "We're in Phoenix" → closest Fly region

# ---- RUNTIME ----
# Interview wants TIERED models (routine: claude-sonnet-4-6, sensitive: claude-opus-4-8).
# The schema has a single `model:` string — per-task tiering is a schema gap (open-item).
# Set to the sensitive-tier default; drafting the principal's mail is sensitive work.
model: claude-opus-4-8
hermes_ref: v2026.5.16@a91a57fa5a13d516c38b07a141a9ce8a3daabeb0

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan
    # Gmail draft replies go out in Scott's voice (Scott sends them). Real writing
    # samples are an onboarding open-item; until then Layer 2 falls back to general.
    voice_profile_id: scott

# ---- PERSONAS ----
# "I want to call the assistant Crane ... a Chief of Staff, not a secretary."
personas:
  - slug: crane
    status: active
    name: Crane
    title: Chief of Staff
    # "plainspoken and direct — executive-summary first ... keep it short."
    tone:
      - plainspoken
      - direct
      - executive-summary
      - concise
    # v1 skill: triage the intake Gmail, draft replies for review. Never sends as Scott
    # (structurally enforced by the gmail.modify token scope in crane_gmail.py).
    skills:
      - name: inbox-triage
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
    # "reading what comes in ... hourly, 0700–1900 Phoenix."
    cron:
      - skill: inbox-triage
        schedule: '0 7-19 * * *' # hourly 0700–1900 (fly_region: lax tz)
        wake_policy: always

# ---- CONNECTORS ----
# All Google ("We run everything in Google"), MCP-first per ADR 0020.
# Email is the principal's intake Gmail (smdurgan@smdurgan.com), connected via OAuth
# at provision time. crane_gmail.py holds only the gmail.modify scope, so Crane can
# read/label/archive/trash but CANNOT send — drafts only. Crane's own outbound
# identity (AgentMail) is NOT wired and is an open onboarding item, not a connector here.
connectors:
  # Crane's OWN mailbox identity = AgentMail (smdcrane@agentmail.to), wired as an
  # MCP server (overlay mcp_registry → mcp.agentmail.to, key AGENTMAIL_API_KEY).
  # This is what makes Crane reachable + able to send/reply on its own identity.
  # The intake Gmail (smdurgan@smdurgan.com) is triaged by the inbox-triage skill
  # via crane_gmail.py directly (gmail.modify, never-send) — NOT this connector.
  Email:
    adapter: agentmail
    backend: mcp:agentmail
    enabled: true
    # Inbound: AgentMail pushes `message.received` here. The route slug
    # (last path segment, `agentmail`) is materialized by the overlay into a
    # platforms.webhook route; the front-door gate (webhook_gate.py) verifies
    # AgentMail's X-AgentMail-Signature before the native adapter routes it.
    webhook_url: https://hermes-smd.fly.dev/webhooks/agentmail
  Calendar:
    adapter: google-calendar
    backend: mcp:google-calendar
    enabled: true
  DocumentStorage:
    adapter: google-drive
    backend: mcp:google-drive
    enabled: true

# ---- WEBHOOK TRIGGERS (inbound, ADR 0021 Stream E) ----
# AgentMail message.received → inbox-triage (inbound reply branch). The overlay
# translate.py materializes this into platforms.webhook; the route HMAC secret is
# the Fly secret WEBHOOK_SECRET_AGENTMAIL (fail-closed without it). The autonomous
# reply is recipient-locked (reply_to_message, in-thread to the original sender)
# and governed by the trust-gate + content floor (money/contract → draft).
webhook_triggers:
  - source: agentmail
    event_type: message.received
    skill: inbox-triage
    persona: crane

# ---- TELEGRAM CHANNEL (ADR 0033) ----
# Crane is reachable on Telegram via Hermes' native polling adapter (getUpdates) —
# NO webhook/public surface (unlike AgentMail email above). The bot TOKEN is the Fly
# secret TELEGRAM_BOT_TOKEN (credential, sourced from Infisical prod
# /ss/operator/customer-zero/telegram/), which auto-enables the polling platform.
# The image must be built with the Dockerfile `--extra messaging` (python-telegram-bot);
# `--extra all` omits it.
#
# The ALLOWLIST below is the AUTHORED SOURCE OF TRUTH (not a loose Fly secret): the
# overlay translate.py _materialize_telegram_platform materializes it into the profile
# config.yaml `telegram:` block, which Hermes maps to TELEGRAM_ALLOWED_USERS.
# MANDATORY and fail-closed: the pinned Hermes ref allows ALL users when the allowlist
# is empty (telegram.py: `if not allowed_csv: return True`); the materializer raises on
# an empty allow_from, and the bootstrap guard (ensure-telegram-allowlist.py) refuses to
# launch if the token is set without a resolvable allowlist. Proven live 2026-06-01.
telegram:
  enabled: true
  # Permitted Telegram numeric user id(s). DM-only. 7367659986 = Scott Durgan.
  allow_from:
    - '7367659986'
  # 1:1 DM assistant: reply to every DM from an allowed user (no @mention needed).
  require_mention: false

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # Inbound autonomous reply acts only on direction from trusted senders
  # (interview: smdurgan.com / smd.services). Untrusted/spoofed sender → the
  # inbound reply branch triages only, never sends. DMARC-in-code (AgentMail
  # surfaces headers['Authentication-Results']) is the documented evolution upgrade.
  trusted_sender_domains:
    - smdurgan.com
    - smd.services
  # ---- TRUST CEILINGS (per-action, ADR 0025) ----
  # Crane sends from its OWN AgentMail identity (smdcrane@agentmail.to) without
  # per-message approval ("default send level autonomous", interview). Floors that
  # still apply ON TOP: content-sensitivity floor (ADR 0031) drops money/contract/
  # scope/legal to draft-for-review; principal-identity (Gmail) sends stay hard-
  # banned (draft only); commitment/destructive keep current-turn-approval floors.
  action_ceilings:
    external_send: autonomous

# ---- ESCALATION ----
# "just flag it to me" → red flags + run failures go to the boss/escalation address.
escalation:
  red_flag_recipients:
    - team@smd.services
  failure_recipients:
    - team@smd.services

# ---- VOICE LIBRARY ----
# Deterministic R2 path. The principal supplied NO writing samples in the interview —
# sample collection is an open onboarding item (onboarding-plan.md Phase 1). Not fabricated.
voice_library:
  samples_path: 'r2://vaults/smd/voice/samples/'

# ---- MEMORY (per-customer isolation invariants; must match customer_id) ----
# Phase 1 runs on Hermes' flat-file memory core (MEMORY.md/USER.md). Inferred memory
# (Honcho) is deferred to Phase 2 — see ADR 0016 (revised 2026-05-30).
memory:
  d1_namespace: smd
  r2_vault_path: 'vaults/smd/'
  vectorize_index: 'hermes-smd-vault'
