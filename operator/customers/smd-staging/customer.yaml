schema_version: 1

# ============================================================================
# STAGING Operator — faithful pre-production mirror of customer-zero (smd).
# ============================================================================
# This is NOT a real customer. It exists so that every change to the Operator
# deploy/boot/voice/env machinery is proven on a Machine provisioned by the
# EXACT same tooling as production, before it ever touches the live business.
# It is a permanent, reusable pre-prod gate for Operator lifecycle work.
#
# Faithful where it matters (same boot sequence: unconditional Workspace
# broker + uid-split, same skill/connector materialization, same voice vault
# path shape, same env contract) but INERT and ISOLATED:
#   - Google credential is a GENERATED, isolated service account (real RSA key,
#     wired to nothing real). It boots the broker identically to prod; it is
#     never used for a live Google call by boot-smoke or the voice gate.
#     Staged at provision time, NEVER committed.
#   - No managed_mailboxes  -> touches no real Google inbox.
#   - No Telegram, no cron. The ONE inbound path is the msgraph Email binding
#     below (ADR 0078 / ss#1978 sandbox e2e): the client-custody mail loop is
#     proven here against the smdopslab SANDBOX tenant (a throwaway M365 we
#     own — operator@smdopslab.onmicrosoft.com), never a real client mailbox.
#   - Own R2 prefix (vaults/smd-staging/), own D1 namespace, own skill-bodies
#     bucket. Shares no mutable state with smd.
#
# Provision with (overriding the real per-customer secrets in /ss so none leak):
#   see operator/customers/smd-staging/PROVISION.md

# ---- IDENTITY ----
customer_id: smd-staging
customer_name: 'SMD Staging (pre-prod, not a real customer)'
vertical: mixed
fly_region: lax

# ---- RUNTIME ----
model: claude-opus-4-8
# Hermes v0.14.0 → v0.18.0 upgrade (staging leads the fleet). Rollback pin:
# v2026.5.16@a91a57fa5a13d516c38b07a141a9ce8a3daabeb0 (uv.lock + uv sync --frozen
# make the Python rebuild reproducible). See docs/runbooks/operator/hermes-v0.18-upgrade-plan.md.
hermes_ref: v2026.7.1@7c1a029553d87c43ecff8a3821336bc95872213b

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- GOOGLE WORKSPACE AUTHORITY ----
# Mirrors smd's DWD shape so the broker boots identically. The credential
# (GOOGLE_SERVICE_ACCOUNT_JSON Fly secret) is a generated isolated key, not the
# real customer credential. Subject is an unresolvable staging address — no
# managed mailboxes, so the broker's authored surface is the subject alone and
# nothing real is reachable.
google_auth:
  mode: dwd
  subject: crane@smd-staging.invalid
  scopes:
    - https://www.googleapis.com/auth/gmail.modify
    - https://www.googleapis.com/auth/calendar.events
    - https://www.googleapis.com/auth/drive

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: staging@smd-staging.invalid
    role: principal
    full_name: Staging Principal
    voice_profile_id: scott

# ---- PERSONAS ----
# Same persona/skill shape as smd so skill + connector materialization is
# exercised. No cron block: the agent does not self-trigger on staging.
personas:
  - slug: crane
    status: active
    name: Crane
    title: Chief of Staff
    tone:
      - plainspoken
      - direct
      - executive-summary
      - concise
    entitlements:
      exposure:
        internal_write: draft_for_review
        external_send: draft_for_review
    skills:
      - name: inbox-triage
        version: pending
        initiation:
          manual: true
          scheduled: false
          # webhook: the msgraph message.received trigger below wakes this
          # skill — the ADR 0078 sandbox e2e inbound path.
          webhook: true
        enabled: true
      - name: workspace
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
    skills_disabled:
      - google-workspace
      - himalaya

# ---- CONNECTORS ----
# Google Workspace (Gmail / Calendar / Drive) rides the governed ADR 0045 Workspace
# broker — NOT the connector mechanism. The broker holds the DWD service-account
# credential (see google_auth:) and exposes the governed workspace_* tools; no CLI to
# shell out to.
connectors:
  # Client-custody email (ADR 0078 / email-channel-seam spec / ss#1978) — the
  # sandbox END-TO-END proof binding. The mailbox is operator@smdopslab
  # .onmicrosoft.com on the smdopslab SANDBOX tenant we own (app-only
  # client-credentials, tenant-side ApplicationAccessPolicy pins the app to
  # exactly this mailbox — proven 2026-07-24, vfy_01KYAP100X / vfy_01KYAQ7V6Q).
  # Inbound rides the overlay delta poller (no public webhook); every polled
  # message enters through the same fence/taint/roster spine as webhook mail.
  # AgentMail is deliberately NOT bound on this seat — one mail path, one
  # custody story (ADR 0078 §1).
  Email:
    adapter: msgraph
    backend: mcp:msgraph-mail
    enabled: true
    msgraph_auth:
      tenant_id: 'f11d2887-b7f2-4464-a9c6-d4db2166b43c'
      client_id: '83a044a4-0b43-4cb4-b989-370aa711af20'
      mailbox: operator@smdopslab.onmicrosoft.com
      secret_ref: 'fly-secret:MSGRAPH_CLIENT_SECRET'
    poll_seconds: 45

# ---- WEBHOOK TRIGGERS ----
# The e2e wake path: a new message in the operator's sandbox inbox (delivered
# by the delta poller through the signed loopback) routes to inbox-triage.
webhook_triggers:
  - source: msgraph
    event_type: message.received
    skill: inbox-triage
    persona: crane

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  trusted_sender_domains:
    - smd-staging.invalid
  # The organization roster (ADR 0055) for the e2e proof: Captain's real
  # addresses classify INTERNAL (no fence, recipient-locked real reply via the
  # relay) — the human-visible acceptance test is Captain emailing the operator
  # and receiving its reply. Anyone else is quarantined + drafted (fail-closed),
  # which is the OTHER half of the proof.
  inbound_allow_from:
    - scott@smd.services
    - smdurgan@smdurgan.com
  # Exposure stays draft_for_review: the model drafts, the relay delivers the
  # recipient-locked reply to the rostered sender (ADR 0072/0055 posture).
escalation:
  red_flag_recipients:
    - staging@smd-staging.invalid
  failure_recipients:
    - staging@smd-staging.invalid

# ---- VOICE LIBRARY ----
# Same path shape as smd. A copy of smd's content-free structural-diff samples
# is staged under vaults/smd-staging/voice/ at setup so the POPULATED voice path
# is exercised end-to-end on staging.
voice_library:
  samples_path: 'r2://vaults/smd-staging/voice/samples/'

# ---- MEMORY (per-customer isolation; must match customer_id) ----
memory:
  d1_namespace: smd-staging
  r2_vault_path: 'vaults/smd-staging/'
  vectorize_index: 'hermes-smd-staging-vault'
