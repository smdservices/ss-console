# ---- AUTHORITY (ADR 0041 dual-mode portal surfaces) ----
# Both #2003 controls rehearse here before the client seat relies on them:
# trust is client-operable so the entitlement-dial probes (Q7) exercise the
# same portal path a Named Administrator uses, and runtime is client-operable
# so the kill-switch probes (Q6: portal pause -> Machine gate -> governance
# row) exercise the same path a firm principal uses. Neither flip cedes SMD
# control: ADR 0041 authority switches grant client self-serve OVER SMD's
# always-present full control. (runtime was managed until the 2026-08-09
# portal-chain proof required the real route; the prior scoping note said the
# A&P seat is the one that authors runtime: client — it still does.)
authority:
  default: managed
  overrides:
    trust: client
    runtime: client

# ---- CONNECTORS ----
connectors:
  # System of record — the net-new mcp:smokeball server (Track A), bound to SMD's
  # Smokeball STAGING tenant. token_ref is seeded once the staging credential
  # lands (Partner Program). The matter.updated webhook drives the memo skill.
  PracticeManagement:
    adapter: smokeball
    backend: mcp:smokeball
    enabled: true
    environment: staging # our own STAGING tenant
    # auth_mode: authorization_code — pilot-smokeball is the firm-delegated rehearsal
    # rig (ADR 0053). The refresh token is obtained at the connect step
    # (bin/connect-smokeball.sh) and set as SMOKEBALL_REFRESH_TOKEN; until then the
    # connector is unwired at boot (boot-before-token). Bound to the staging
    # "SMD Operator (Auth Code)" app via SMOKEBALL_STAGING_* creds.
    auth_mode: authorization_code
    token_ref: 'infisical:/operator/pilot-smokeball/practice-management/smokeball-oauth'
    webhook_url: 'https://hermes-pilot-smokeball.fly.dev/webhooks/smokeball'

  # The Operator's OWN inbox (default-on, toggleable). Anyone can email it; the
  # inbound webhook routes to the spine. AGENTMAIL_API_KEY is a Fly secret.
  Email:
    adapter: agentmail
    backend: mcp:agentmail
    enabled: true
    webhook_url: 'https://hermes-pilot-smokeball.fly.dev/webhooks/agentmail'

  # WebSearch (native:brave-free, ADR 0070) — bound here so the rehearsal rig
  # exercises native web search before any paid seat (fixtures -> pilot-smokeball
  # -> paid). Hermes' native brave-free provider (no MCP wrapper), reads
  # BRAVE_SEARCH_API_KEY staged by provision-customer.sh. This is the
  # live-verification binding for the ADR 0070 native go-live, not an Operator
  # default (Operator = authored-per-engagement).
  WebSearch:
    adapter: brave
    backend: native:brave-free
    enabled: true

  # NOTE: Calendar + DocumentStorage are added at provision once the firm's mail
  # platform is confirmed (Google path shipped; M365 = Track E). Smokeball has no
  # calendar API, so calendar always rides the mail binding. Documents ride the
  # Smokeball Documents API (mcp:smokeball get_files_on_matter), not a separate
  # store — pending the Track 0 doc-entitlement confirmation.

# ---- WEBHOOK TRIGGERS ----
# source must match a connector adapter that has a webhook_url above.
webhook_triggers:
  # The flagship: a Smokeball matter change drives the internal supervision memo.
  - source: smokeball
    event_type: matter.updated
    skill: matter-memo-on-update
    persona: operator
    # Authored trigger exceptions (gate-enforced: 202 + WEBHOOK_SUPPRESSED audit
    # row, no agent wake). The ops/digest-home matter is plumbing, not a case —
    # the Operator must not write supervision memos about its own notepad.
    # Actor exclusions (e.g. the supervising principal's own edits) are authored
    # per firm at connect with the real vendor userId; NOT authored here because
    # the rehearsal harness's App 1 PATCHes are the L2 trigger path.
    exclude:
      matters:
        - 3c191bed-cdda-48b9-a6ed-a51a349f3f94 # 2026-OPS-001 (digest home)
    # Per-(trigger, matter) cooldown (#1781): the seat's own create_memo echoes
    # back as matter.updated (~12 min vendor latency, proven live 2026-07-06→07)
    # and re-wakes this skill — a self-sustaining loop. The gate parks any
    # delivery for a matter already inside the window (202 + WEBHOOK_SUPPRESSED,
    # trigger-cooldown:<matter>), so the echo never wakes the agent and the
    # chain terminates. 30 = the gate's platform default, authored explicitly
    # here so the loop-break is visible in the seat's config, not implicit.
    throttle:
      cooldown_minutes: 30
  # An inbound email to the Operator routes through the spine to the right skill.
  - source: agentmail
    event_type: message.received
    skill: matter-inbox-router
    persona: operator

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # The organization roster (ADR 0055) — who the Operator may RESPOND to (not just
  # draft) when they email its inbox. The reply is recipient-locked to the verified
  # sender; this list authorizes the autonomous reply. Seeded to the SMD operator so
  # the Captain's mail to pilot-smokeball@agentmail.to comes back as a real reply
  # (the live test of the employee model). Empty roster = fail-closed (drafts only).
  inbound_allow_from:
    - scott@smd.services
    - smdurgan@smdurgan.com
    # Staging-only probe channel (ADR 0075 verification). A rostered SMD-owned
    # AgentMail sender so the probe ladder can drive clean-trust gateway turns
    # programmatically (the CLI channel is PID-gated out of the audit broker).
    # Never copy to a client seat.
    - ss-probe-runner@agentmail.to
    # Staging-only ADMIN probe channel (ss#2222 gate 3 / card R2). A second
    # SMD-owned AgentMail sender that IS on scope.admins below, so the
    # admin-classed initiation leg (skill fires) can be driven programmatically
    # while ss-probe-runner keeps the rostered-non-admin decline leg testable.
    # Establishment is email-only by authored design (the MCP door carries no
    # sender identity), so admin-gated establishment proofs ride this channel
    # too. Never copy to a client seat.
    - ss-probe-admin@agentmail.to
  # The Operator-admin allow list (ADR 0085 §2) — who may establish the firm's
  # voice and output shapes by instructing the Operator, and who may promote a
  # captured correction. Mirrors the shape authored on ashton-price (where the
  # list is the two Named Administrators of letter 18), with the rehearsal
  # admin standing in for them so the establishment path can be driven here
  # before it touches the client seat.
  #
  # Deliberately NARROWER than the roster above: smdurgan@smdurgan.com and the
  # probe runner are rostered (they get real replies) but are NOT admins, which
  # is what makes the "a rostered non-admin is refused" leg testable on this
  # seat. Person addresses only; a whole-@domain grant is refused.
  #
  # Empty = fail-closed. Changed only through a PR.
  admins:
    - scott@smd.services
    # Staging-only admin probe (ss#2222 gate 3) — drivable admin-classed
    # initiation for card rehearsals and establishment proofs (stage/analyze/
    # install + the possession ceremony); mirrors A&P's two-admin shape. Never
    # copy to a client seat.
    - ss-probe-admin@agentmail.to
  # Typed outbound roster (ADR 0075) — the firm's own client / records-vendor
  # addresses, which resolve to the external_send_client / external_send_vendor
  # action classes instead of the outside external_send ceiling. These two are
  # the letter's only two outside-firm sends the "a person sends it" rule does
  # NOT cover (the firm's own client and its own vendor), so they carry their own
  # graduatable ceilings.
  #
  # STAGING STAND-INS: Ashton & Price's real client and records-vendor addresses
  # do not exist on this staging seat. These are non-deliverable RFC-2606
  # `.example` addresses on an SMD-labeled domain, so no mail can leave for a real
  # third party regardless of send posture. Re-pointed 2026-07-13 to dedicated
  # deliverable SMD-controlled AgentMail inboxes for the ADR 0075 live probes.
  outbound_roster:
    - address: ap-client-standin@agentmail.to
      class: client
      note: 'client stand-in inbox for the live send probes'
    - address: ap-records-standin@agentmail.to
      class: records_vendor
      note: 'records vendor stand-in inbox for the live send probes'
  # External send (to anyone OUTSIDE the roster and NOT in outbound_roster) follows
  # the authored external_send ceiling above — draft_for_review under the Ashton &
  # Price day-one grid posture (2026-07-09 letter), the letter's permanent
  # "a person sends it" cap for opposing counsel and the court. Recipient-locked
  # replies to rostered senders are governed by inbound_allow_from above, and typed
  # client / records-vendor sends by outbound_roster above, not by this ceiling
  # (ADR 0055 §3 / ADR 0075).
  #
  # This is SMD's own STAGING TEST seat (not a client). The Operator manages its
  # own sample matters for testing, so it gets full document-write autonomy here:
  #   - internal_write (add_file save-back, create_memo, drafts) -> autonomous
  #   - destructive   (delete_file)                              -> autonomous
  # destructive stays taint-gated regardless of this ceiling, so an untrusted-fed
  # turn can NEVER trigger a delete. A real client seat authors its own posture
  # (a firm would typically leave destructive refused/draft).

