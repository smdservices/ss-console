schema_version: 1

# ashton-price — the PRODUCTION Operator for the Ashton & Price law-firm pilot
# (ADR 0053). This is bound to A&P's REAL production Smokeball tenant via the
# firm-delegated authorization_code grant, NOT our own staging tenant. The
# rehearsal rig is the separate `pilot-smokeball` seat (our staging) — do NOT
# conflate them: separate app, tenant, credentials, Fly app, slug.
#
# Validate:  npx tsx scripts/validate-customer-yaml.ts \
#              operator/customers/ashton-price/customer.yaml
#
# SEAT INPUTS RESOLVED 2026-06-24 (Captain-confirmed from A&P directly):
#   - fly_region: sjc — A&P main office is Fair Oaks (Sacramento), CA; San Jose
#     is the nearest Fly US-West region (closer than the pilot's lax).
#   - users: Chris Price (principal/litigator) + Christa Barrera (office manager,
#     the firm's financial/operational spine) authored below with real emails.
#     Scott (SMD) stays as the pilot-period operator (removed/converted at handoff).
#   - mail/calendar platform: M365 / Office 365 (confirmed). Calendar + mail ride
#     Microsoft Graph, NOT Smokeball (no Smokeball calendar API). The M365 backend
#     is not yet runtime-wired (Track E) — added at a later provision, not here.
#
# STILL EXTERNAL before provisioning:
#   - hermes_ref: pin to the OVERLAY_REF carrying the smokeball auth-code change
#     (ss-console + overlay PRs) at provision time.
#   - SMOKEBALL_PROD_* creds + the refresh token land at the connect step; until
#     then the smokeball connector is unwired (boot-before-token), Machine healthy.
#   - Smokeball 72hr app review (submitted 2026-06-24) must clear to unlock the
#     Production callback tab where hermes-ashton-price's callback is registered.

# ---- IDENTITY ----
customer_id: ashton-price
customer_name: 'Ashton & Price LLP'
vertical: law-firm
addons: []
practice_areas:
  - personal-injury-plaintiff
fly_region: sjc # Fair Oaks (Sacramento), CA — San Jose is the nearest Fly region

# ---- RUNTIME ----
model: claude-opus-4-8
# CONFIRM: bump to the OVERLAY_REF carrying the smokeball authorization_code +
# per-seat-env change before reprovision.sh (matches pilot at provision time).
hermes_ref: v2026.5.16@a91a57fa5a13d516c38b07a141a9ce8a3daabeb0

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- HUMANS WITH PORTAL ACCESS ----
# A&P's two principals-of-use plus the SMD operator for the pilot period.
# Chris = the firm principal/decision-maker; Christa = office manager (the
# financial/operational spine — trust/IOLTA, AP/AR, file org). Scott is the SMD
# operator running the pilot hands-on; his entry is removed or converted to a
# support role at handoff.
users:
  - email: chris@ashtonandprice.com
    role: principal
    full_name: Chris Price
  - email: christa@ashtonandprice.com
    role: staff
    full_name: Christa Barrera
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan

# ---- PERSONAS ----
# One coordinator persona — the law spine + the two committed deliverables
# (matter-memo-on-update, matter-document-review). Every external-bound message
# stays draft_for_review (the law external-send floor, ADR 0005, non-raisable).
# Name/voice are a PROPOSED default; the firm authors the final identity.
personas:
  - slug: quinn
    status: active
    name: Quinn
    title: AI Case Coordinator
    tone:
      - plainspoken
      - warm-but-professional
      - concise
    skills:
      # spine
      - name: matter-inbox-router
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: matter-status-digest
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      # intake / conflict
      - name: new-matter-intake
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: conflict-intake-router
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: consult-scheduler
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      # keeping matters moving
      - name: engagement-letter-chaser
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: trust-balance-nudge
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: matter-status-responder
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: document-receipt-logger
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: stalled-matter-nudge
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      # committed deliverables
      - name: matter-memo-on-update # Chris's named ask — webhook-driven internal supervision memo
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: matter-document-review # surface/highlight only, never drafts work product
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      # deadlines
      - name: deadline-and-sol-tracker
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
      - name: deadline-miss-escalator
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
    # The escalator runs on Hermes-native cron; pre_run.py decides whether a
    # deadline needs the ladder, else writes SUPPRESSED_WAKE.
    cron:
      - skill: deadline-miss-escalator
        schedule: '0 7 * * *' # daily 0700 PT
        pre_run: pre_run.py
        wake_policy: pre_run_decides
    # Native Google/Himalaya mail skills disabled — the Operator's inbox is AgentMail.
    skills_disabled:
      - google-workspace
      - himalaya

# ---- MCP CONNECTOR (Operator ⇄ Claude) ----
# Enabled so translate.py emits the core /webhooks/mcp route (fail-closed: needs
# enabled:true AND WEBHOOK_SECRET_MCP set). That route carries the SMD operator's
# go-live verification turn (the post-connect smoke read: auth_status →
# list_matters against A&P's real Smokeball) via the transitional stub bearer
# (SMD_MCP_STUB_TOKEN), and the Clerk-gated bridge below once Clerk env is set.
# Access here is the SMD operator ONLY (Scott's Clerk subjects). The FIRM's Claude
# bridge — Chris's second ask — is a deliberate later step: it is scoped to Chris
# first, the per-user confidentiality walls are an unsolved-hard problem, and his
# Clerk subject is unknown until he signs into the portal. Not granted at go-live.
mcp_connector:
  enabled: true
  data_posture: open
  access:
    - email: scott@smd.services
      profile: quinn
      clerk_subjects:
        - user_3EEs0aMBRgu6PRxBa4g5YhHjggD
        - user_3E1RPGrTMxkSqciXMTyybUNSJWu

# ---- CONNECTORS ----
connectors:
  # System of record — A&P's PRODUCTION Smokeball, firm-delegated grant.
  # environment: production selects the prod hosts (auth.smokeball.com /
  # api.smokeball.com) AND sources SMOKEBALL_PROD_* creds at provision.
  # auth_mode: authorization_code — the firm authorizes via login + Allow; the
  # refresh token is set at the connect step (bin/connect-smokeball.sh).
  PracticeManagement:
    adapter: smokeball
    backend: mcp:smokeball
    enabled: true
    environment: production
    auth_mode: authorization_code
    token_ref: 'infisical:/operator/ashton-price/practice-management/smokeball-oauth'
    webhook_url: 'https://hermes-ashton-price.fly.dev/webhooks/smokeball'

  # The Operator's OWN inbox (default-on). AGENTMAIL_API_KEY is a Fly secret.
  Email:
    adapter: agentmail
    backend: mcp:agentmail
    enabled: true
    webhook_url: 'https://hermes-ashton-price.fly.dev/webhooks/agentmail'

  # NOTE: A&P's mail/calendar platform is M365 / Office 365 (confirmed). Mail +
  # calendar ride Microsoft Graph (Smokeball has no calendar API). The M365
  # backend is not yet runtime-wired (Track E), so the Calendar connector is added
  # at a later provision — authoring it here would be dropped by translate.py.
  # Documents ride the Smokeball Documents API (get_files_on_matter), not a
  # separate store.

# ---- WEBHOOK TRIGGERS ----
webhook_triggers:
  # The flagship: a Smokeball matter change drives the internal supervision memo.
  - source: smokeball
    event_type: matter.updated
    skill: matter-memo-on-update
    persona: quinn
  # An inbound email to the Operator routes through the spine to the right skill.
  - source: agentmail
    event_type: message.received
    skill: matter-inbox-router
    persona: quinn

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # Fail-closed: external send is drafted, never autonomous (law floor, ADR 0005).
  action_ceilings:
    external_send: draft_for_review

# ---- ESCALATION ----
escalation:
  red_flag_recipients:
    - scott@smd.services
  failure_recipients:
    - scott@smd.services

# ---- VOICE LIBRARY ----
# Empty until the firm supplies writing samples; ships with the general voice.
voice_library:
  samples_path: 'r2://vaults/ashton-price/voice/samples/'

# ---- MEMORY (per-customer isolation invariants; must match customer_id) ----
memory:
  d1_namespace: ashton-price
  r2_vault_path: 'vaults/ashton-price/'
  vectorize_index: 'hermes-ashton-price-vault'
