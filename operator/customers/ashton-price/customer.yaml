# ashton-price — the PRODUCTION Operator for the Ashton & Price law-firm pilot
# (ADR 0053). This is bound to A&P's REAL production Smokeball tenant via the
# firm-delegated authorization_code grant, NOT our own staging tenant. The
# rehearsal rig is the separate `pilot-smokeball` seat (our staging) — do NOT
# conflate them: separate app, tenant, credentials, Fly app, slug.
#
# Validate:  npx tsx scripts/validate-customer-yaml.ts \
#              operator/customers/ashton-price/customer.yaml
#
# SEAT INPUTS RESOLVED 2026-06-24 (Captain-confirmed from A&P directly):
#   - fly_region: sjc — A&P main office is Fair Oaks (Sacramento), CA; San Jose
#     is the nearest Fly US-West region (closer than the pilot's lax).
#   - users: Chris Price (principal/litigator) + Christa Barrera (office manager,
#     the firm's financial/operational spine) authored below with real emails.
#     Scott (SMD) stays as the pilot-period operator (removed/converted at handoff).
#   - mail/calendar platform: M365 / Office 365 (confirmed). Calendar + mail ride
#     Microsoft Graph, NOT Smokeball (no Smokeball calendar API). The M365 backend
#     is not yet runtime-wired (Track E) — added at a later provision, not here.
#
# STILL EXTERNAL before provisioning:
#   - hermes_ref: pin to the OVERLAY_REF carrying the smokeball auth-code change
#     (ss-console + overlay PRs) at provision time.
#   - SMOKEBALL_PROD_* creds + the refresh token land at the connect step; until
#     then the smokeball connector is unwired (boot-before-token), Machine healthy.
#   - Smokeball 72hr app review (submitted 2026-06-24) must clear to unlock the
#     Production callback tab where hermes-ashton-price's callback is registered.

# ---- IDENTITY ----
customer_id: ashton-price
customer_name: 'Ashton & Price LLP'

# ---- SEAT DESCRIPTOR ----
# What this seat IS. Kind and product only; lifecycle state is DERIVED from
# probes of the running system and is deliberately absent here — a state field
# is a claim an agent can write, and a claim an agent can write is one that rots.
# A&P's REAL production Smokeball tenant; a real firm's real matters.
seat:
  kind: customer
  product: operator

# ---- OUTPUT CLASSES (ADR 0083) ----
# Mirrors the proving seat's declaration (pilot-smokeball, fixtures -> pilot ->
# client discipline): the firm's voice is EXPECTED on staff mail and on work
# product, established through the self-initiation / establishment path.
# format_spec: none is an authored choice — the drafting lane's skeletons and
# mechanical gates own work-product shape.
#
# TWO AUTHORED CAVEATS, read before touching this block:
# (a) PRECONDITION: this seat's rebuild pin must carry overlay#2234's
#     proceed-and-alert semantics. Before #2234, `voice_spec: expected` with
#     no installed spec REFUSED every autonomous send — on the pilot that
#     froze internal mail for six days with no alert (#2228). On a pre-#2234
#     pin this block would recreate that outage on a production client seat,
#     case alerts included. Verify the pin at activation with a probe +
#     crane_verify; never assume.
# (b) STANDING ALERT WINDOW: from rebuild until the firm blesses its voice,
#     the seat raises `spec_control_broken:staff.voice` on the heartbeat.
#     That alert is AUTHORED state, not a defect: the seat declares a control
#     it does not yet have, and it resolves the moment voice establishment
#     installs the staff spec. work_product carries no such window (its class
#     is external_send: forbidden — no send exists for a missing spec to
#     downgrade).
output_classes:
  staff:
    voice_spec: expected
    format_spec: none
  work_product:
    voice_spec: expected
    format_spec: none

vertical: law-firm
addons:
  - law-firm/pi@0.3.0 # the CA PI-litigation lifecycle pack (19 routine skills active here; the v0.3.0 drafting lane is NOT activated on this seat — see the fail-closed block at the end of the skills list)
practice_areas:
  - personal-injury-plaintiff
fly_region: sjc # Fair Oaks (Sacramento), CA — San Jose is the nearest Fly region

# ---- RUNTIME ----
# Light main, escalate up (ADR 0049): Sonnet runs the high-frequency volume —
# conversation, inbox triage, simple replies — cheaply; genuinely heavy work
# (matter-document-review et al., pre-weighted) escalates to Opus via the SOUL
# instruction translate.py renders when escalation_model is set.
model: claude-sonnet-4-6
escalation_model: claude-opus-4-8
# CONFIRM: bump to the OVERLAY_REF carrying the smokeball authorization_code +
# per-seat-env change before reprovision.sh (matches pilot at provision time).
hermes_ref: v2026.7.1@7c1a029553d87c43ecff8a3821336bc95872213b

machine:
  size: shared-cpu-1x
  memory_mb: 1024

