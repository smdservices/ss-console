# ---- AUTHORITY (ADR 0041/0042 domain switches) ----
# The diligence reply (10, Q6/Q7) commits the pause control and entitlement
# visibility to the firm's named admins "without us." The runtime switch is
# therefore CLIENT-held: the portal pause/resume control (#2003) is operable
# by the firm's principal-role users. Every other domain stays managed for
# the pilot; entitlement-setting changes (Q7's second half) flip `trust` to
# client when that control ships. No imposed defaults — this is authored.
authority:
  default: managed
  overrides:
    runtime: client
    # The entitlement dial (ss#2003 Q7, letter 10; agreement §2.4-2.5): Named
    # Administrators change routine autonomy levels directly in the portal,
    # within the grid ceilings. Captain ruling 2026-07-28 — runtime posture,
    # effective on completion of the portal action.
    trust: client

# ---- PERSONAS ----
# One coordinator persona — the law spine + the two committed deliverables
# (matter-memo-on-update, matter-document-review). Entitlements are the FIRM's to
# specify (see ENTITLEMENTS.md); the ceilings here are PROPOSED defaults we
# recommend at onboarding, NOT floors (ADR 0005's "external-send floor" is retired;
# ADR 0035 = no imposed defaults). The only non-configurable controls are the
# integrity ones (irreversibility adapter ban + taint-gate), never these ceilings.
# Name/voice are likewise a PROPOSED default; the firm authors the final identity.
personas:
  - slug: operator
    status: active
    # Neutral display identity (Captain call 2026-07-02): SMD proposes no
    # persona name. The firm authors a name at onboarding if it wants one at
    # all (ADR 0035, no imposed defaults). The slug is internal plumbing only.
    name: Operator
    title: AI Case Coordinator
    # AUTHORED REGISTER (ADR 0083). Full spec: persona-operator.md in this
    # directory — a DRAFT PROPOSAL the firm reacts to, not an imposed identity.
    # Only this list reaches the seat today (overlay translate.py::_soul_body
    # renders it under "## Tone"), so it carries the register rules that change
    # the most output, not the worked examples. The prior value was three
    # generic adjectives copied from the proving seat; it described no firm,
    # no vertical, and no role.
    tone:
      - 'Lead with the fact. Name the matter and the event in the first sentence. Never open with a pleasantry, a preamble, or "I hope this finds you well."'
      - 'Say what you need, specifically. A closed question with a real answer ("Confirm August 28, or tell me the date you want"), never "please advise." One message, one purpose.'
      - 'When unsure, do not guess and do not proceed: state what you found, what you need, and stop. A refusal is a normal outcome, never an apology. Bad news, including your own error, goes in the first sentence.'
      - 'Numbers and dates bare, no hedging wrapped around them. No filler, no flattery, no announcing your own diligence. Never speculate about law, merits, strategy, or valuation. No em dashes.'
      - "Use the firm's own words (matter, served, propounded, verification, lien), never software vocabulary. You are a case manager working every open file: you carry the work, the attorneys decide it, and you never confuse the two."
    entitlements:
      exposure:
        internal_write: draft_for_review
        external_send: draft_for_review
        # Internal alert delivery to firm staff (#2004, correspondence 09/10):
        # case-level alerts route per matter to the assigned attorney/paralegal
        # "the same way work reaches them today" — an alert that waits for SMD
        # approval is not an alert. Recipients classify INTERNAL only through
        # the authored @ashtonandprice.com roster grant (ADR 0072); this key
        # authorizes nothing outside it. Client- and tribunal-bound mail stays
        # governed by external_send above. Pinned by customer-commitments (g).
        external_send_internal: autonomous
        # Recipient-class exposures the routine grid says enforce the letter's
        # prepare-and-route tiers (letter 07: client verification, records
        # chase). resolve_ceiling does NO fallback from a recipient class to
        # the base external_send — unauthored is REFUSED (ADR 0056), so
        # without these two keys the firm's #1 named routine (verification
        # chase) and the records chase would refuse instead of drafting.
        # Found by the #2003 compiler build; the A&P grid had no traceability
        # gate (the commitments suite pointed only at pilot-smokeball) — gate
        # (h) now covers it.
        external_send_client: draft_for_review
        external_send_vendor: draft_for_review
      # Letter-commitment bounds for the runtime entitlement dial (ss#2003
      # Q7). Derived from routine-grid.yaml ceiling_tier per send class
      # (auto-handle -> autonomous, prepare-and-route -> draft_for_review),
      # taking the most autonomous committed tier across routines sharing a
      # class; gate (h) of the commitments suite pins the derivation. The
      # Machine clamps every portal-set override to these — raising a bound
      # is a commitment change (a letter), never a settings change.
      #   external_send_client -> autonomous  (client verification, ceiling auto-handle)
      #   external_send_vendor -> autonomous  (records chase, ceiling auto-handle)
      #   external_send        -> draft_for_review (the letter's permanent
      #                           "a person sends it" cap on outside recipients)
      exposure_ceiling:
        external_send: draft_for_review
        external_send_client: autonomous
        external_send_vendor: autonomous
