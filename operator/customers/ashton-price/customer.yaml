  # api.smokeball.com) AND sources SMOKEBALL_PROD_* creds at provision.
  # auth_mode: authorization_code — the firm authorizes via login + Allow; the
  # refresh token is set at the connect step (bin/connect-smokeball.sh).
  PracticeManagement:
    adapter: smokeball
    backend: mcp:smokeball
    enabled: true
    environment: production
    auth_mode: authorization_code
    token_ref: 'infisical:/operator/ashton-price/practice-management/smokeball-oauth'
    webhook_url: 'https://hermes-ashton-price.fly.dev/webhooks/smokeball'

  # The Operator's OWN inbox (default-on). AGENTMAIL_API_KEY is a Fly secret.
  Email:
    adapter: agentmail
    backend: mcp:agentmail
    enabled: true
    webhook_url: 'https://hermes-ashton-price.fly.dev/webhooks/agentmail'

  # NOTE: A&P's mail/calendar platform is M365 / Office 365 (confirmed). Mail +
  # calendar ride Microsoft Graph (Smokeball has no calendar API). The M365
  # backend is not yet runtime-wired (Track E), so the Calendar connector is added
  # at a later provision — authoring it here would be dropped by translate.py.
  # Documents ride the Smokeball Documents API (get_files_on_matter), not a
  # separate store.

# ---- WEBHOOK TRIGGERS ----
webhook_triggers:
  # The flagship: a Smokeball matter change drives the internal supervision memo.
  - source: smokeball
    event_type: matter.updated
    skill: matter-memo-on-update
    persona: operator
    # Per-(trigger, matter) cooldown (#1781): breaks the create_memo →
    # matter.updated echo loop at the gate (202 + WEBHOOK_SUPPRESSED; the echo
    # never wakes the agent). Proven live on pilot-smokeball 2026-07-06→07 —
    # on THIS seat the loop would write unbounded agent memos into the firm's
    # production Smokeball. 30 = platform default, authored explicitly.
    # AT PRODUCTION CONNECT (plan §3/M3, issue #1671): additionally author the
    # seat's own Smokeball userId (known after the firm's OAuth) into
    # exclude.actors so the Operator's writes are excluded precisely, not just
    # coalesced.
    throttle:
      cooldown_minutes: 30
  # An inbound email to the Operator routes through the spine to the right skill.
  - source: agentmail
    event_type: message.received
    skill: matter-inbox-router
    persona: operator

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # The organization roster (ADR 0055) — who the Operator may RESPOND to (not just
  # draft) when they email its inbox. The whole firm (@ashtonandprice.com) plus the
  # SMD operator; replies are recipient-locked to the verified sender. So Chris,
  # Christa, and firm staff get real answers from the Operator out of the box, while
  # anyone OUTSIDE the firm is drafted (reaching outside needs explicit
  # authorization, ADR 0055 §3). Empty roster = fail-closed (drafts only).
  inbound_allow_from:
    - '@ashtonandprice.com'
    - scott@smd.services
  # The Operator-admin allow list (ADR 0085 §2) — who may establish the firm's
  # voice and output shapes by instructing the Operator, and who may promote a
  # captured correction. Chris and Christa are the two Named Administrators of
  # letter 18; the config key is ours, the people are the paper's. Scott
  # (SMD) was added PERMANENTLY by Captain decision 2026-08-11 (the
  # self-initiation decision set) so SMD can run initiation and establishment
  # on the firm's behalf. Letter 18 named only the firm's two admins, so this
  # third admin is disclosed to the firm (Captain follow-up, tracked with the
  # ss#2220 rescope).
  #
  # Why this list is NOT the roster above: the roster is domain-wide, so every
  # person at the firm gets real answers. Establishment is narrower on purpose —
  # an associate asking for a different tone is captured as a proposed
  # correction, and an admin decides whether it becomes how the firm
  # writes. Person addresses only; a whole-@domain grant is refused by the
  # validator precisely because it would erase that distinction.
  #
  # Empty = fail-closed: no admin-classed instruction exists on any channel.
  # Changed only through a PR.
  admins:
    - chris@ashtonandprice.com
    - christa@ashtonandprice.com
    - scott@smd.services
  # External send to non-roster recipients is drafted, never autonomous — client-
  # and tribunal-bound mail ships under a human reviewer. The draft_for_review
  # posture is authored on the persona's entitlements.exposure (ADR 0056), the
  # RECOMMENDED default the firm confirms or changes at onboarding (ENTITLEMENTS.md),
  # not a fixed floor (ADR 0035). Recipient-locked replies to rostered senders are
  # governed by the roster above, not by this ceiling (ADR 0055 §3).

# ---- REPLY-CHANNEL SEND POLICY (ss#2070) ----
# Chris asked for something he can talk to. The platform default — 3 replies to
# one sender per 10 minutes, hardcoded until #2070 — cuts a conversation off at
# the fourth exchange and, before the auto-release landed, never resumed: the
# Operator simply went quiet mid-thread with no notice to either side. On this
# engagement that is the "one mistake" failure mode, not a missing feature.
#
# The roster above is domain-wide (`@ashtonandprice.com`), so everyone at the
# firm classifies INTERNAL and is exempt from the per-sender window. What still
# bounds the channel is the reply backstop: 60 replies an hour, every class
# counted. Two people in a working conversation are nowhere near it; a stuck
# loop trips it inside the hour instead of mailing the firm all day. Senders NOT
# on the roster keep the tight platform caps, unchanged.
#
# Values are the settled platform decision (Captain, 2026-07-30), authored
# identically on pilot-smokeball (#2076) and proven there before landing here:
# leg 1 ran ten exchanges on one thread with zero rate holds
# (vfy_01KYV9QEEEVB1H9G3YPMFYZJ5E). Held replies release automatically within
# the TTL rather than being dropped.
send_policy:
  reply:
    internal_exempt: true # the whole firm is rostered INTERNAL
    per_sender_max: 3 # non-roster senders: platform default, unchanged
    per_sender_window_seconds: 600
    global_max: 20 # non-roster aggregate: platform default, unchanged
    global_window_seconds: 3600
    backstop_max: 60 # the runaway bound, all classes
    backstop_window_seconds: 3600
  held_release:
    enabled: true
    ttl_seconds: 86400

# ---- ESCALATION ----

# ---- BUSINESS HOURS ----
# Sets the seat's IANA timezone. bootstrap.sh exports it as HERMES_TIMEZONE, so
# Hermes' clock AND this seat's cron schedules run in this timezone (DST-correct
# via ZoneInfo). Unauthored = UTC (the container clock). Hours/days are the
# firm's working window for future business-hours-aware behavior; the timezone
# is the load-bearing field today.
business_hours:
  timezone: America/Los_Angeles
  days: [mon, tue, wed, thu, fri]
  start: '08:00'
  end: '18:00'

escalation:
  # red_flag_recipients is the CENTRAL case-alert list — the delivery target
  # while case_alert_routing.mode is central (below).
  # Bring-up composition (Captain, 2026-08-09): everything goes to Christa AND
  # Scott — Christa so the firm sees and judges real output from day one, Scott
  # so SMD sees exactly what she's seeing. Routing to SMD only was explicitly
  # rejected ("how would we know if it is correct?").
  red_flag_recipients:
    - christa@ashtonandprice.com
    - scott@smd.services
  # System/technical failures stay with SMD (correspondence 10: "System and
  # technical monitoring stays with us").
  failure_recipients:
    - scott@smd.services
  # BRING-UP POSTURE (Captain, 2026-08-09): central routing during stand-up so
  # no alert reaches any firm staff beyond Christa until the firm says widen.
  # Christa's per-matter routing requirement (correspondence 09, 2026-07-23;
  # committed in 10 — case-level alerts route per matter to the assigned
  # attorney/paralegal, never a central firm inbox) is the GRADUATION target:
  # flip mode back to matter_staff on the firm's "turn it up", per the
  # 2026-07-29 call agreement that alerts start with Chris + Christa only.
  # Resolution + fallback algorithm (matter_staff mode):
  # operator/skills/deadline-miss-escalator/references/case-alert-routing.md.
  # fallback_recipients is DELIBERATELY unauthored: who receives an alert when
  # a matter has no usable assignment is the firm's call (working-session
  # input, firm-input register); until authored, resolution failure HOLDS the
  # alert fail-closed and flags the matter in place. Never invented.
  case_alert_routing:
    mode: central

