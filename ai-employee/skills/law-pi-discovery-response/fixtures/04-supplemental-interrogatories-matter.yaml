    SUPPLEMENTAL INTERROGATORIES PROPOUNDED BY DEFENDANT TOBIAS
    VANDERMEER TO PLAINTIFF MAYA CASTANEDA.

    Pursuant to Arizona Rules of Civil Procedure Rule 33,
    Defendant propounds the following supplemental interrogatories,
    each of which is to be answered separately, fully, and under
    oath within forty (40) days of service.

    INTERROGATORY NO. 21: Identify each and every social media
    account maintained by Plaintiff at any time from January 1,
    2025 to the present, including the platform, the username or
    handle, and the date the account was opened.

    INTERROGATORY NO. 22: For each social media account
    identified in response to Interrogatory No. 21, state whether
    any post, comment, photograph, or video has been deleted
    since the date of the incident. If so, identify the deleted
    item and the approximate date of deletion.

    INTERROGATORY NO. 23: Identify each medical provider whom
    Plaintiff has consulted or with whom Plaintiff has had any
    appointment between Plaintiff's deposition on March 12, 2026
    and the present, regardless of whether the visit was related
    to the injuries claimed in this litigation.

    INTERROGATORY NO. 24: State whether Plaintiff has engaged in
    any physical activity (including but not limited to athletic
    activity, hiking, manual labor, household chores, or
    childcare) since the date of the incident that Plaintiff
    contends she could perform without limitation prior to the
    incident.

    [continues through INTERROGATORY NO. 35]

