  body: |
    Dear Sarah,

    Following review of the discovery record to date, including
    Plaintiff's deposition testimony of April 28, 2026 and the
    investigation report from our retained expert Dr. Reginald
    Vance, P.E. (accident reconstruction), our position on
    liability is as follows.

    1. The vehicle dynamics at the moment of impact establish
       that Plaintiff was not, as he testified, fully stopped
       prior to the collision. Skid mark evidence is consistent
       with deceleration ongoing at impact.

    2. The traffic signal sequence at the intersection of Indian
       School and 32nd Street, as established by the City of
       Phoenix signal-timing records produced June 1, 2026, is
       inconsistent with Plaintiff's claim that he had a green
       light.

    3. We will be moving for partial summary judgment on the
       issue of comparative fault not later than June 30, 2026.

    Please advise whether Plaintiff is willing to discuss
    settlement in advance of motion practice, or whether we
    should proceed with our filing.

    Best regards,
    Eleanor Whitmore

