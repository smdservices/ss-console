    Dear Sarah,

    Pursuant to Arizona Rules of Civil Procedure Rule 30, we
    intend to take the deposition of your client, Plaintiff
    Dustin Bramlett, at our offices at 230 N Central Avenue,
    Suite 1200, Phoenix AZ 85004. We propose three dates for
    your consideration: June 18, 2026 starting at 10:00 AM;
    June 24, 2026 starting at 9:30 AM; or July 9, 2026 starting
    at 1:00 PM. The deposition is estimated to require
    approximately six hours including breaks.

    Please confirm one of the proposed dates by reply email no
    later than May 30, 2026. If none of the proposed dates work
    for Mr. Bramlett, please reply with two alternative dates
    within the next 45 days that work for both Mr. Bramlett and
    your office. Per local custom we will arrange the court
    reporter and the conference room; we ask that you confirm
    whether Mr. Bramlett will appear in person or whether you
    request remote attendance via Zoom.

    A formal Notice of Deposition will follow once the date is
    set.

    Sincerely,
    Lucille Trent
    Trent & Eichelberger LLP

