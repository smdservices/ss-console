[project]
name = "ai-employee-shipstation"
version = "0.1.0"
description = "MCP wrapper for the ShipStation V2 API — Tier-1 connector for manufacturing + DTC shippers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SMD Services" }]
license = { text = "MIT" }
dependencies = [
  "mcp==1.16.0",
  "httpx==0.28.1",
  "pydantic>=2.11.0",
]

[project.scripts]
ai-employee-shipstation = "ai_employee_shipstation.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
