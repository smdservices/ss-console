# Addon manifest — law-firm/pi (personal injury plaintiff)
#
# Per ADR 0022. Declares the assets that ship with the PI addon pack;
# customer.yaml subscribes via `addons: [law-firm/pi@<version>]`.
#
# Authoritative manifest spec: docs/specs/ai-employee/vertical-manifest-schema.md
# Track-the-pack issue: #1091 (parent), #1114 (this migration PR).

name: pi
version: 0.1.0

# Addon-specific compliance constraints layered on top of the parent
# law-firm vertical's `privilege` + `upl-boundary` constraints. PI work
# additionally enforces medical-records HIPAA handling.
compliance:
  - hipaa-medical-records

# Addon skills. Path-organized under skills/ — each entry references a
# directory at addons/pi/skills/<name>/ with its SKILL.md frontmatter
# declaring the runtime identifier.
skills:
  - demand-letter-draft
  - discovery-response
  - intake-triage
  - opposing-counsel-response
  - settlement-prep

# Addon-specific connectors. Filevine/Clio/LawPay are PI-flavored
# practice-management / billing tools. Live here (not at vertical level)
# until cross-addon usage emerges.
connectors:
  - capability: PracticeManagement
    adapter: filevine
    backend: 'build:'
  - capability: PracticeManagement
    adapter: clio
    backend: 'mcp:clio-oktopeak'
  - capability: Payments
    adapter: lawpay
    backend: 'build:'

# PI-specific synthetic matters, billing entries, intake transcripts, and
# edge-case fixtures. Generator at fixtures/generator.py reproduces the
# synthetic data.
fixtures:
  - billing-entries
  - client-communication
  - conflict-check-inputs
  - intake-transcripts
  - matter-records
  - matters
  - edge-ambiguous-intake
  - edge-citation-injection
  - edge-hostile-tone
  - edge-missing-fields
  - edge-prompt-injection

# Skill bundles wired into the addon (slash-command surface). Bundle
# slugs intentionally retain the `pi-` prefix as user-facing command
# names: /pi-intake and /pi-matter-prep stay recognizable in a
# multi-vertical Hermes shell.
templates:
  - bundles/intake.yaml
  - bundles/matter-prep.yaml

# Addon-specific certification battery. Golden tests at tests/golden/
# cover the four customer-facing skills (intake-triage has no golden in
# v1; it's structural-only).
evals:
  - tests/golden
