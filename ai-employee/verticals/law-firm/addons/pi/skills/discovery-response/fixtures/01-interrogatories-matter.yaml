  jurisdiction_rule_applied: 'Ariz. R. Civ. P. 33 (30-day response window)'
  numbered_items:
    - number: 1
      text: 'State the full name, current residential address, and current employer of each person likely to have discoverable information regarding the subject incident.'
      expected_objection_categories: []

    - number: 2
      text: 'Identify each healthcare provider, hospital, urgent-care facility, imaging center, or therapist who has examined, treated, or evaluated the plaintiff for injuries arising from the subject incident, including the dates of each visit.'
      expected_objection_categories: []

    - number: 3
      text: 'For each healthcare provider identified in response to Interrogatory No. 2, state the diagnosis, the treatment provided, and the current treatment status.'
      expected_objection_categories: []

    - number: 4
      text: 'State the dates of every visit, consultation, or appointment with any healthcare provider since the subject incident, organized chronologically.'
      expected_objection_categories: []

    - number: 5
      text: 'Identify any medical condition, injury, or impairment the plaintiff suffered, was diagnosed with, or sought treatment for during the ten years prior to the subject incident, including any healthcare provider consulted for such condition.'
      expected_objection_categories: ['not proportional to the needs of the case', 'overbroad']

    - number: 6
      text: 'State each employer the plaintiff worked for during the five years prior to the subject incident, including dates of employment and position held.'
      expected_objection_categories: ['not proportional to the needs of the case']

    - number: 7
      text: "State the plaintiff's gross earnings for each year during the five years prior to the subject incident."
      expected_objection_categories: ['not proportional to the needs of the case']

    - number: 8
      text: "Describe in detail every prior personal-injury claim, lawsuit, or insurance claim filed by or on behalf of the plaintiff at any time in the plaintiff's life, including the claim number, the parties involved, the disposition, and the amount of any recovery."
      expected_objection_categories:
        ['overbroad', 'not proportional to the needs of the case', 'vague and ambiguous']

    - number: 9
      text: 'Identify all medications the plaintiff has taken at any time during the five years prior to the subject incident, including dosage, prescribing provider, and reason for the prescription.'
      expected_objection_categories:
        ['overbroad', 'not proportional to the needs of the case', 'unduly burdensome']

    - number: 10
      text: 'State the names and contact information of each attorney the plaintiff has consulted regarding the subject incident, and identify the dates of each consultation.'
      expected_objection_categories: ['seeks information protected by attorney-client privilege']

    - number: 11
      text: "Describe each conversation the plaintiff has had with the plaintiff's counsel of record regarding the subject incident, including the date, the participants, and the subject matter discussed."
      expected_objection_categories:
        [
          'seeks information protected by attorney-client privilege',
          'seeks information protected by the work-product doctrine',
        ]

    - number: 12
      text: 'Identify all healthcare providers who have treated the plaintiff in the past ten years, regardless of whether the treatment is related to the subject incident.'
      expected_objection_categories:
        ['overbroad', 'not proportional to the needs of the case', 'unduly burdensome']

    - number: 13
      text: "State the plaintiff's expert opinion as to the causation of the disc herniation diagnosed on the MRI dated May 12, 2026."
      expected_objection_categories: ['premature', 'seeks expert opinion']

    - number: 14
      text: 'State the dollar amount of damages the plaintiff intends to claim at trial.'
      expected_objection_categories: ['premature', 'seeks expert opinion']

    - number: 15
      text: 'Identify each fact witness the plaintiff intends to call at trial, including current address and the subject matter of expected testimony.'
      expected_objection_categories: []

