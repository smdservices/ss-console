# Vertical pack manifest — law-firm
#
# Per ADR 0022. The law-firm vertical currently ships a single addon
# (`pi`) under addons/pi/. Shared law-firm-level skills
# (law-conflict-check, law-client-status-update) stay at ai-employee/skills/
# until a second law addon exists (per ADR 0022 Stream 4 plan §"Out of
# scope"); once a second specialty lands they lift into `skills/` here.
#
# Authoritative manifest spec: docs/specs/ai-employee/vertical-manifest-schema.md
# Track-the-pack issue: #1091 (parent), #1114 (this migration PR).

name: law-firm
version: 0.1.0

# Vertical-level compliance constraints. ABA Model Rule 5.5 (UPL) and
# Rule 1.6 (privilege) apply to every law-firm persona. Enforcement is at
# the agent layer (Hermes plugin overlay), not at the validator layer.
compliance:
  - privilege
  - upl-boundary

# Non-raisable per-action-class trust floors (ADR 0025 / ADR 0022 compliance
# constraints). Customer configuration and skill promotion can never raise an
# action class above its floor here. The overlay's `hermes-smd-trust` plugin
# loads these into `vertical_floors` and passes them to
# `adapter/trust_ceiling.py::enforce()`, which takes the most restrictive of
# {floor, customer override, safe default}.
#
# For a law firm, every outbound communication ships under the reviewer's
# identity per ABA Formal Opinion 512 / state AI-disclosure rules — so
# external_send is pinned at draft_for_review and cannot be promoted to
# autonomous, preserving reviewer-as-sender as a hard floor for this vertical
# (the moat ADR 0005 protects, expressed as a floor rather than a global
# absolute per ADR 0025).
trust_floors:
  external_send: draft_for_review

# Reference persona archetypes. Empty in v1 — customer-zero is the first
# concrete persona shape and lives in customer.yaml directly. Promote
# reusable archetypes here as multi-customer patterns emerge.
personas: []

# Vertical-default skills (shared across law-firm addons). Empty in v1
# — the existing law-conflict-check and law-client-status-update skills
# live at ai-employee/skills/ until a second addon exists. Lifting them
# here ships as a follow-on PR.
skills: []

# Vertical-default connectors. Filevine/Clio/LawPay are PI-flavored but
# generic enough to potentially apply to other law specialties; live in
# the addon manifest until cross-addon usage emerges.
connectors: []

# Vertical-grade test fixtures. None at this layer in v1; all PI fixtures
# live under addons/pi/fixtures/.
fixtures: []

# Vertical-default templates.
templates: []

# Vertical-level certification battery.
evals: []
