# TEMPLATE vertical.yaml for a new vertical pack — ADR 0022 Stream 1.
#
# Copy this file to ai-employee/verticals/<vertical-slug>/vertical.yaml and
# populate the lists with the assets your pack ships. The vertical slug MUST
# appear in ACCEPTED_VERTICALS (src/lib/ai-employee/customer-yaml/types.ts).
# Once the pack stabilizes, customers pin to it via customer.yaml:
#   vertical: <vertical-slug>@<version>
#
# Authoritative spec: docs/specs/ai-employee/vertical-manifest-schema.md
#
# IMPORTANT: this v1 schema is flat — no `extends:` field. Industry-to-
# specialty inheritance is reserved for a future ADR amendment; the validator
# rejects `extends:` at top level with an explicit error (fail-closed).

name: '[VERTICAL-SLUG, e.g., law-firm]'
version: '0.1.0' # MAJOR.MINOR.PATCH, no pre-release suffixes in v1

# Compliance constraints that apply to every persona in this vertical.
# Free-form strings; the runtime enforces specific ones (e.g. 'privilege',
# 'upl-boundary' for law-firm). Empty list when no vertical-level constraints.
compliance: []

# Reference persona archetypes the customer's customer.yaml can clone.
# These are templates, not runtime personas — bootstrap doesn't instantiate
# them automatically. Empty list when the vertical ships skills without
# opinionated persona shapes.
personas: []

# Vertical-default skills. Each entry references a skill directory either
# under this vertical (`skills/<name>/`) or shared across verticals
# (`ai-employee/skills/<name>/` — kept until a second vertical needs it).
skills: []

# Vertical-default connectors. Each entry is `<capability>: <adapter>@<backend-prefix>`
# (e.g. `PracticeManagement: filevine@build:`). Capability slugs match
# ACCEPTED_CAPABILITY_NAMES in types.ts.
connectors: []

# Vertical-grade test fixtures shipped with the pack. Path relative to this
# vertical.yaml file.
fixtures: []

# Templates the pack provides (SOP frameworks, email/letter templates, etc.).
templates: []

# Certification eval battery the pack must pass before being marked GA in
# customer-facing materializations. Path relative to this vertical.yaml.
evals: []
