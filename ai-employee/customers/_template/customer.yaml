schema_version: 1

# TEMPLATE customer.yaml for a PI law firm demo.
#
# Copy this file to ai-employee/customers/{firm-slug}/customer.yaml, then
# replace every bracketed value. Validate with the canonical TS validator
# (per ADR 0019):
#
#   npx tsx scripts/validate-customer-yaml.ts \
#     ai-employee/customers/{firm-slug}/customer.yaml
#
# The reserved `_template` directory is never a real customer slug.
# customer_id must equal the directory name and match ^[a-z0-9][a-z0-9-]{0,31}$.

# ---- IDENTITY ----
customer_id: '[FIRM-SLUG]'
customer_name: '[LEGAL NAME]'
vertical: law-firm
practice_areas:
  - '[PRIMARY PRACTICE AREA, e.g., personal-injury-plaintiff]'
fly_region: '[FLY REGION SLUG, e.g., iad / lax / ord]'

# ---- RUNTIME ----
model: claude-opus-4-7
hermes_ref: '[HERMES FORK REF, e.g., v2026.5.7-smd.0]'

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: '[PRINCIPAL EMAIL]'
    role: principal
    full_name: '[PRINCIPAL FULL NAME]'

# ---- PERSONAS (length >= 1) ----
personas:
  - slug: '[PERSONA SLUG, e.g., marcus]'
    status: active
    name: '[PERSONA FIRST NAME]'
    title: AI Associate
    tone:
      - plainspoken
      - warm-but-professional
      - concise
    skills:
      - name: '[LEAD PI SKILL, e.g., law-pi-demand-letter-draft]'
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
    # ---- OPTIONAL: skill bundles (ADR 0021 Stream D) ----
    # bundles:
    #   - slug: pi-intake
    #     description: 'Intake triage + conflict screen for a new prospect'
    #     skills:
    #       - law-pi-intake-triage
    #       - law-conflict-check
    #     instruction: 'Optional shared context prepended to every bundled skill'
    #
    # ---- OPTIONAL: per-skill cron schedules (ADR 0021 Stream B) ----
    # cron:
    #   - skill: paid-media-anomaly-watcher
    #     schedule: '0 7 * * *'        # daily 0700 PT
    #     pre_run: pre_run.py          # required when wake_policy is pre_run_decides
    #     wake_policy: pre_run_decides # pre_run.py decides wakeAgent; MUST emit
    #                                  # audit_action='suppressed_wake' on silent path
    #   - skill: status-report-assembler
    #     schedule: 'every 1d'
    #     wake_policy: always          # no pre_run; agent wakes every tick

# ---- CONNECTORS ----
# Hypothesized stack from the dossier. Confidence-low items should start
# as synthetic and switch to a real adapter only after Captain confirms
# during the assessment call.
connectors:
  PracticeManagement:
    # Whatever PM system the firm uses, or synthetic:fixture if none.
    adapter: '[clio / synthetic]'
    backend: '[mcp:clio-oktopeak / synthetic:fixture]'
    enabled: true
  Email:
    adapter: '[m365-mail / google-gmail / synthetic]'
    backend: '[mcp:m365-mail / mcp:google-gmail / synthetic:fixture]'
    enabled: true
    # tenant_id REQUIRED when backend is mcp:m365-mail. Microsoft Entra
    # tenant UUID; captured by Captain during onboarding. The bootstrap
    # CLI resolves the per-tenant hosted MCP URL from it.
    # tenant_id: '00000000-0000-0000-0000-000000000000'
  Calendar:
    adapter: '[m365-calendar / google-calendar / synthetic]'
    backend: '[mcp:m365-calendar / mcp:google-calendar / synthetic:fixture]'
    enabled: true
    # tenant_id REQUIRED when backend is mcp:m365-calendar (same as Email).
    # tenant_id: '00000000-0000-0000-0000-000000000000'
  InternalComms:
    adapter: '[m365-teams / slack / synthetic]'
    backend: '[mcp:m365-teams / mcp:slack / synthetic:fixture]'
    enabled: true
    # tenant_id REQUIRED when backend is mcp:m365-teams.
    # tenant_id: '00000000-0000-0000-0000-000000000000'
  DocumentStorage:
    adapter: '[ms-365 / google-drive / synthetic]'
    backend: '[mcp:softeria/ms-365-mcp-server / mcp:google-drive / synthetic:fixture]'
    enabled: true

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []

# ---- ESCALATION ----
escalation:
  red_flag_recipients:
    - '[PRINCIPAL EMAIL]'
  failure_recipients:
    - '[PRINCIPAL EMAIL]'

# ---- VOICE LIBRARY ----
voice_library:
  samples_path: 'r2://vaults/[FIRM-SLUG]/voice/samples/'

# ---- MEMORY (isolation invariants; must match customer_id) ----
memory:
  d1_namespace: '[FIRM-SLUG]'
  r2_vault_path: 'vaults/[FIRM-SLUG]/'
  vectorize_index: 'hermes-[FIRM-SLUG]-vault'
