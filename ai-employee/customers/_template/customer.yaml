schema_version: 1

# TEMPLATE customer.yaml for a PI law firm demo.
#
# Copy this file to ai-employee/customers/{firm-slug}/customer.yaml, then
# replace every bracketed value. Validate with the canonical TS validator
# (per ADR 0019):
#
#   npx tsx scripts/validate-customer-yaml.ts \
#     ai-employee/customers/{firm-slug}/customer.yaml
#
# The reserved `_template` directory is never a real customer slug.
# customer_id must equal the directory name and match ^[a-z0-9][a-z0-9-]{0,31}$.

# ---- IDENTITY ----
customer_id: '[FIRM-SLUG]'
customer_name: '[LEGAL NAME]'
# ADR 0022 Stream 1: vertical accepts either bare (legacy back-compat) or
# pinned form (<vertical>@<semver>). Pin once the vertical pack ships at a
# stable version. Bare form is fine for pre-launch customer-zero.
vertical: law-firm
# Optional add-on packs the customer subscribes to. Each entry is
# <vertical>/<addon>@<semver> (cross-vertical composition allowed —
# ADR 0022 §"Properties of the vertical model" bullet 3). v1 ships with
# law-firm/pi only. Empty array means "vertical defaults only."
addons: []
practice_areas:
  - '[PRIMARY PRACTICE AREA, e.g., personal-injury-plaintiff]'
fly_region: '[FLY REGION SLUG, e.g., iad / lax / ord]'

# ---- RUNTIME ----
model: claude-opus-4-7
hermes_ref: '[HERMES FORK REF, e.g., v2026.5.7-smd.0]'

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: '[PRINCIPAL EMAIL]'
    role: principal
    full_name: '[PRINCIPAL FULL NAME]'

# ---- PERSONAS (length >= 1) ----
personas:
  - slug: '[PERSONA SLUG, e.g., marcus]'
    status: active
    name: '[PERSONA FIRST NAME]'
    title: AI Associate
    tone:
      - plainspoken
      - warm-but-professional
      - concise
    skills:
      - name: '[LEAD PI SKILL, e.g., law-pi-demand-letter-draft]'
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
    # ---- OPTIONAL: skill bundles (ADR 0021 Stream D) ----
    # bundles:
    #   - slug: pi-intake
    #     description: 'Intake triage + conflict screen for a new prospect'
    #     skills:
    #       - law-pi-intake-triage
    #       - law-conflict-check
    #     instruction: 'Optional shared context prepended to every bundled skill'
    #
    # ---- OPTIONAL: per-skill cron schedules (ADR 0021 Stream B) ----
    # cron:
    #   - skill: paid-media-anomaly-watcher
    #     schedule: '0 7 * * *'        # daily 0700 PT
    #     pre_run: pre_run.py          # required when wake_policy is pre_run_decides
    #     wake_policy: pre_run_decides # pre_run.py decides wakeAgent; MUST emit
    #                                  # audit_action='suppressed_wake' on silent path
    #   - skill: status-report-assembler
    #     schedule: 'every 1d'
    #     wake_policy: always          # no pre_run; agent wakes every tick

# ---- CONNECTORS ----
# Hypothesized stack from the dossier. Confidence-low items should start
# as synthetic and switch to a real adapter only after Captain confirms
# during the assessment call.
#
# OPTIONAL `webhook_url` (ADR 0021 Stream E): if the vendor pushes events,
# point them at the customer's own Fly Machine. Pattern enforces that the
# embedded slug matches customer_id (cross-customer leakage vector if not).
#   webhook_url: 'https://hermes-[FIRM-SLUG].fly.dev/webhooks/practice_management'
connectors:
  PracticeManagement:
    adapter: '[filevine / clio / no_pm]'
    backend: '[build:filevine / mcp:clio-oktopeak / synthetic:no_pm]'
    enabled: true
  Email:
    adapter: '[m365-mail / google-gmail / synthetic]'
    backend: '[mcp:m365-mail / mcp:google-gmail / synthetic:fixture]'
    enabled: true
  Calendar:
    # ADR 0021 Stream F migration (PR #1080): M365 calendar shipped as
    # first-party MCP. Per ADR 0020 the MCP-first ordering applies.
    adapter: '[m365-calendar / google-calendar / synthetic]'
    backend: '[mcp:m365-calendar / mcp:google-calendar / synthetic:fixture]'
    enabled: true
  DocumentStorage:
    # ADR 0021 Stream F migration (PR #1080): Microsoft has not shipped a
    # first-party OneDrive/SharePoint MCP. The community MIT
    # `mcp:softeria/ms-365-mcp-server` covers the Files surface; the
    # retired BUILD adapter at `ai-employee/connectors/ms_graph/` is
    # removed in the Wave-4 removal PR.
    adapter: '[ms-365 / google-drive / synthetic]'
    backend: '[mcp:softeria/ms-365-mcp-server / mcp:google-drive / synthetic:fixture]'
    enabled: true

# ---- OPTIONAL: webhook triggers (ADR 0021 Stream E) ----
# Map inbound vendor webhook payloads to skill invocations on a persona.
# Each `source` MUST be a connector adapter with `webhook_url` configured.
# webhook_triggers:
#   - source: filevine
#     event_type: matter.created
#     skill: law-pi-intake-triage
#     persona: '[PERSONA SLUG]'
#   - source: filevine
#     event_type: document.added
#     skill: law-pi-discovery-response
#     persona: '[PERSONA SLUG]'

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []

# ---- ESCALATION ----
escalation:
  red_flag_recipients:
    - '[PRINCIPAL EMAIL]'
  failure_recipients:
    - '[PRINCIPAL EMAIL]'

# ---- VOICE LIBRARY ----
voice_library:
  samples_path: 'r2://vaults/[FIRM-SLUG]/voice/samples/'

# ---- MEMORY (isolation invariants; must match customer_id) ----
memory:
  d1_namespace: '[FIRM-SLUG]'
  r2_vault_path: 'vaults/[FIRM-SLUG]/'
  vectorize_index: 'hermes-[FIRM-SLUG]-vault'
  # ADR 0022 Stream 2 (skill body persistence) populates these at bootstrap.
  # Never hand-author them. Schema declared in PR 1 as known-optional so
  # Stream 2 can consume them without amending the validator. See
  # docs/specs/ai-employee/vertical-manifest-schema.md §"Skill body R2 keys".
  # r2_skill_bodies_bucket: 'smd-ai-employee-skill-bodies'   # shared-bucket default
  # r2_skill_bodies_prefix: '[FIRM-SLUG]/'                   # shared-bucket prefix
