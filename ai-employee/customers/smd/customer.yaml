schema_version: 1

# SMD Services — customer-zero (internal "eat our own cooking" instance, ADR 0004 / #776).
#
# GENERATED by the aie-onboard skill from the SMD narrative intake
# (.agents/skills/aie-onboard/references/test-cases.md, Case 1). Every value below
# traces to a statement in that intake; undeterminable facts are left as onboarding
# open-items in onboarding-plan.md, never invented.
#
# Not provisioned, not committed by the skill. Captain reviews before either.
#
# `vertical: mixed` is the honest non-fabricated choice — the enum has no
# consulting/services value (PRD open question, #776).

# ---- IDENTITY ----
customer_id: smd
customer_name: 'SMDurgan, LLC'
vertical: mixed
fly_region: lax # "We're in Phoenix" → closest Fly region

# ---- RUNTIME ----
model: claude-opus-4-7
hermes_ref: v2026.5.16@a91a57fa5a13d516c38b07a141a9ce8a3daabeb0

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: smdurgan@venturecrane.com
    role: principal
    full_name: Scott Durgan

# ---- PERSONAS ----
# "I want to call the assistant Crane ... a Chief of Staff, not a secretary."
personas:
  - slug: crane
    status: active
    name: Crane
    title: Chief of Staff
    # "plainspoken and direct — executive-summary first ... keep it short."
    tone:
      - plainspoken
      - direct
      - executive-summary
      - concise
    # "The one job I want to start with is my inbox ... drafting replies for me to
    # review — it should never send on its own." → inbox-triage at draft_for_review.
    skills:
      - name: inbox-triage
        version: pending
        trust_ceiling: draft_for_review
        enabled: true
    # "reading what comes in every morning" → daily morning run.
    cron:
      - skill: inbox-triage
        schedule: '0 7 * * *' # daily 0700 (fly_region: lax tz)
        wake_policy: always

# ---- CONNECTORS ----
# "We run everything in Google — Gmail, Google Calendar, and Google Drive." All three
# named explicitly → vendor-direct Google MCPs per ADR 0020. No composio.
connectors:
  Email:
    adapter: google-gmail
    backend: mcp:google-gmail
    enabled: true
  Calendar:
    adapter: google-calendar
    backend: mcp:google-calendar
    enabled: true
  DocumentStorage:
    adapter: google-drive
    backend: mcp:google-drive
    enabled: true

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []

# ---- ESCALATION ----
# "just flag it to me at the same address."
escalation:
  red_flag_recipients:
    - smdurgan@venturecrane.com
  failure_recipients:
    - smdurgan@venturecrane.com

# ---- VOICE LIBRARY ----
# Deterministic R2 path. NOTE: the principal supplied no writing samples in the
# intake — sample collection is an open onboarding item (see onboarding-plan.md
# Phase 1). Not fabricated here.
voice_library:
  samples_path: 'r2://vaults/smd/voice/samples/'

# ---- MEMORY (per-customer isolation invariants; must match customer_id) ----
# Phase 1 runs on Hermes' flat-file memory core (MEMORY.md/USER.md). Inferred
# memory (Honcho) is deferred to Phase 2 — see ADR 0016 (revised 2026-05-30).
# The fields below are the customer-owned D1/R2 memory file's isolation anchors.
memory:
  d1_namespace: smd
  r2_vault_path: 'vaults/smd/'
  vectorize_index: 'hermes-smd-vault'
